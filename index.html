          <tbody>
            {filtered.length===0?<tr><td colSpan="7"><EmptyState t={t}/></td></tr>:
            filtered.slice((offPage-1)*offPageSize, offPage*offPageSize).map(o=>{
              const co=data.customers.find(c=>c.id===o.customerId);
              const calc=calcOffer(o.items||[],o.discount,o.tax);
              return (
                <tr key={o.id}>
                  <td><span className="cell-code">{o.offerNo}</span></td>
                  <td style={{fontSize:13}}>{o.date}</td>
                  <td>{co ? <button className="cell-link" onClick={()=>setViewingCustomerOff(co)}>{co.name}</button> : <span style={{color:'var(--text3)'}}>—</span>}</td>
                  <td><span className="badge badge-gray">{o.items?.length||0} items</span></td>
                  <td><span className="price-cell">{fmt(calc.afterDisc,o.currency)}</span></td>
                  <td><Badge text={o.status} color={statusColor[o.status]||'gray'}/></td>
                  <td><div className="table-actions">
                    <button className="btn btn-ghost btn-sm btn-icon" onClick={()=>open('view',o)} title={t.view}><Icon name="eye" size={14}/></button>
                    {(o.status==='Draft'||o.status==='Sent') && <button className="btn btn-ghost btn-sm btn-icon" onClick={()=>open('edit',o)} title={t.edit}><Icon name="edit" size={14}/></button>}
                    {o.status==='Accepted' && !data.orders.find(x=>x.offerId===o.id) && <button className="btn btn-success btn-sm" onClick={()=>convertToOrder(o)}><Icon name="convert" size={13}/> {t.convert}</button>}
                    {isManager&&<button className="btn btn-ghost btn-sm btn-icon" style={{color:'var(--red)'}} onClick={()=>setDeleteTarget(o.id)}><Icon name="trash" size={14}/></button>}
                  </div></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <Pagination total={filtered.length} page={offPage} pageSize={offPageSize} onPage={(p)=>setOffPage(p)} onPageSize={(s)=>{setOffPageSize(s);setOffPage(1);}}/>

      {/* VIEW Modal */}
      {modal==='view' && form && (()=>{
        const co=data.customers.find(c=>c.id===form.customerId);
        const calc=calcOffer(form.items||[],form.discount,form.tax);
        return (
          <Modal open={true} title={`${t.offerDetails} — ${form.offerNo}`} onClose={()=>setModal(null)} large
            footer={<>
              {form.status==='Accepted' && !data.orders.find(x=>x.offerId===form.id) && <button className="btn btn-success" onClick={()=>convertToOrder(form)}><Icon name="convert" size={14}/> {t.convert}</button>}
              <button className="btn btn-secondary" onClick={()=>setModal(null)}>{t.close}</button>
            </>}>
            <div className="form-grid">
              <div className="form-group"><label className="form-label">{t.offerNo}</label><div className="form-input" style={{background:'var(--bg4)',fontFamily:'Rajdhani',fontWeight:700}}>{form.offerNo}</div></div>
              <div className="form-group"><label className="form-label">{t.customer}</label><div className="form-input" style={{background:'var(--bg4)'}}>{co?.name||'—'}</div></div>
              <div className="form-group"><label className="form-label">{t.date}</label><div className="form-input" style={{background:'var(--bg4)'}}>{form.date}</div></div>
              <div className="form-group"><label className="form-label">{t.status}</label><div style={{padding:'8px 0'}}><Badge text={form.status} color={statusColor[form.status]}/></div></div>
            </div>
            <div className="divider"/>
            <div style={{marginBottom:8,fontWeight:700,fontSize:12,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'0.5px'}}>{t.lineItems}</div>
            <div className="line-items-wrap">
              <table className="li-table">
                <thead><tr><th>#</th><th>{t.product}</th><th>{t.qty}</th><th>{t.unitPrice}</th><th>{t.lineTotal}</th></tr></thead>
                <tbody>
                  {form.items.map((item,i)=>(
                    <tr key={i}><td style={{color:'var(--text3)',width:30}}>{i+1}</td><td>{item.productName}</td><td>{item.qty}</td><td>{fmt(item.unitPrice,form.currency)}</td><td style={{fontWeight:600}}>{fmt(item.qty*item.unitPrice,form.currency)}</td></tr>
                  ))}
                  <tr className="li-total"><td colSpan="4" style={{textAlign:'right',paddingRight:12,fontWeight:600,color:'var(--text2)'}}>{t.subtotal}</td><td>{fmt(calc.sub,form.currency)}</td></tr>
                  {form.discount>0&&<tr className="li-total"><td colSpan="4" style={{textAlign:'right',paddingRight:12,fontWeight:600,color:'var(--text2)'}}>Discount ({form.discount}%)</td><td style={{color:'var(--red)'}}>−{fmt(calc.disc,form.currency)}</td></tr>}
                  {form.tax>0&&<tr className="li-total"><td colSpan="4" style={{textAlign:'right',paddingRight:12,fontWeight:600,color:'var(--text2)'}}>VAT ({form.tax}%)</td><td>{fmt(calc.taxAmt,form.currency)}</td></tr>}
                  <tr className="li-total"><td colSpan="4" style={{textAlign:'right',paddingRight:12,fontSize:15}}>{t.grandTotal}</td><td style={{fontSize:16,color:'var(--primary)'}}>{fmt(calc.grand,form.currency)}</td></tr>
                </tbody>
              </table>
            </div>
            {form.notes&&<div className="info-box" style={{marginTop:14}}><Icon name="file" size={14}/> {form.notes}</div>}
          </Modal>
        );
      })()}

      {/* ADD/EDIT Modal */}
      {(modal==='add'||modal==='edit') && (
        <Modal open={true} title={modal==='add'?t.addOffer:t.editOffer} onClose={()=>setModal(null)} large
          footer={<><button className="btn btn-secondary" onClick={()=>setModal(null)}>{t.cancel}</button><button className="btn btn-primary" onClick={save}>{t.save}</button></>}>
          <div className="form-grid cols-3">
            <FG label={t.offerNo}><input className="form-input" value={form.offerNo||''} onChange={e=>setForm({...form,offerNo:e.target.value})}/></FG>
            <FG label={t.date}><input className="form-input" type="date" value={form.date||''} onChange={e=>setForm({...form,date:e.target.value})}/></FG>
            <FG label={t.status}>
              <select className="form-select" value={form.status||'Draft'} onChange={e=>setForm({...form,status:e.target.value})}>
                {statuses.map(s=><option key={s}>{s}</option>)}
              </select>
            </FG>
            <FG label={t.customer} span={2}>
              <div style={{position:'relative'}}>
                <input className="form-input" placeholder="🔍 ابحث عن عميل..." value={coSearch}
                  onChange={e=>{setCoSearch(e.target.value); if(!e.target.value) setForm(f=>({...f,customerId:''}));}}
                  autoComplete="off" style={{marginBottom:4}}/>
                {form.customerId && form.customerId!=='__new__' && (()=>{
                  const sel=accCos.find(c=>c.id===Number(form.customerId));
                  return sel?<div style={{padding:'6px 10px',background:'var(--primary-bg)',border:'1px solid var(--primary)',borderRadius:6,fontSize:13,fontWeight:600,color:'var(--primary)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    ✅ {sel.name}
                    <button style={{background:'none',border:'none',cursor:'pointer',color:'var(--red)',fontSize:18,lineHeight:1}} onClick={()=>{setForm(f=>({...f,customerId:''}));setCoSearch('');}}>×</button>
                  </div>:null;
                })()}
                {!form.customerId && coSearch.length>0 && (()=>{
                  const matches=accCos.filter(c=>c.name.toLowerCase().includes(coSearch.toLowerCase())||c.code.toLowerCase().includes(coSearch.toLowerCase()));
                  return <div style={{border:'1px solid var(--border)',borderRadius:8,boxShadow:'0 4px 16px rgba(0,48,135,.1)',background:'#fff',maxHeight:180,overflowY:'auto',zIndex:999}}>
                    <div style={{padding:'4px 10px',fontSize:11,color:'var(--text3)',background:'var(--bg3)',borderBottom:'1px solid var(--border)'}}>اختار عميل:</div>
                    {matches.length===0&&<div style={{padding:'10px 12px',fontSize:13,color:'var(--text3)'}}>لا يوجد نتائج</div>}
                    {matches.map(c=><div key={c.id}
                      onMouseDown={e=>{e.preventDefault();setForm(f=>({...f,customerId:c.id}));setCoSearch(c.name);}}
                      style={{padding:'8px 12px',cursor:'pointer',fontSize:13,display:'flex',justifyContent:'space-between',borderBottom:'1px solid var(--bg3)'}}
                      onMouseEnter={e=>e.currentTarget.style.background='var(--bg3)'}
                      onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                      <span style={{fontWeight:600}}>{c.name}</span>
                      <span style={{color:'var(--text3)',fontSize:11}}>{c.code} · {c.status}</span>
                    </div>)}
                    <div onMouseDown={e=>{e.preventDefault();setForm(f=>({...f,customerId:'__new__'}));setCoSearch('+ عميل جديد');}}
                      style={{padding:'8px 12px',cursor:'pointer',fontSize:13,color:'var(--sky)',fontWeight:600,borderTop:'1px solid var(--border)'}}>
                      ➕ إضافة عميل جديد
                    </div>
                  </div>;
                })()}
              </div>
              {form.customerId==='__new__' && (
                <div style={{marginTop:8,padding:'10px 12px',background:'var(--blue-bg)',border:'1px dashed var(--sky)',borderRadius:'var(--r)'}}>
                  <label className="form-label" style={{color:'var(--sky)',marginBottom:5,display:'block'}}>✦ {t.newCompanyName||'New Company Name'}</label>
                  <input className="form-input" placeholder={t.companyName||'Company name...'} value={newOfferCoName||''} onChange={e=>{setNewOfferCoName(e.target.value);setNewOfferCoErr('');}} autoFocus style={{borderColor:newOfferCoErr?'var(--red)':'var(--sky)'}}/>
                  {newOfferCoErr&&<div style={{color:'var(--red)',fontSize:11,marginTop:4}}>⚠ {newOfferCoErr}</div>}
                </div>
              )}
            </FG>
            <FG label={t.currency}>
              <select className="form-select" value={form.currency||'EGP'} onChange={e=>setForm({...form,currency:e.target.value})}>
                <option value="EGP">EGP — Egyptian Pound</option>
                <option value="USD">USD — US Dollar</option>
              </select>
            </FG>
          </div>
          <div className="divider"/>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <span style={{fontWeight:700,fontSize:12,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'0.5px'}}>{t.lineItems}</span>
            <button className="btn btn-secondary btn-sm" onClick={addItem}>{t.addItem}</button>
          </div>
          <div className="line-items-wrap">
            <table className="li-table">
              <thead><tr><th>{t.product}</th><th style={{width:70}}>{t.qty}</th><th style={{width:140}}>{t.unitPrice}</th><th style={{width:130}}>{t.lineTotal}</th><th style={{width:40}}></th></tr></thead>
              <tbody>
                {(form.items||[]).map((item,i)=>(
                  <tr key={i}>
                    <td style={{position:'relative'}}>
                      {item.productId ? (()=>{
                        const sel=data.products.find(p=>p.id===Number(item.productId));
                        return <div style={{display:'flex',alignItems:'center',gap:6}}>
                          <span style={{flex:1,fontSize:12,fontWeight:600,color:'var(--text)'}}>{sel?`${sel.code} — ${sel.name}`:'?'}</span>
                          <button style={{background:'none',border:'none',cursor:'pointer',color:'var(--red)',fontSize:16}} onClick={()=>{updateItem(i,'productId','');setProdSearches(s=>({...s,[i]:''}))}}>×</button>
                        </div>;
                      })() : <div style={{position:'relative'}}>
                        <input className="li-input" placeholder="🔍 ابحث عن منتج..." style={{width:'100%'}}
                          value={prodSearches[i]||''} onChange={e=>setProdSearches(s=>({...s,[i]:e.target.value}))} autoComplete="off"/>
                        {(prodSearches[i]||'').length>0 && (()=>{
                          const q=(prodSearches[i]||'').toLowerCase();
                          const matches=data.products.filter(p=>p.active&&(p.name.toLowerCase().includes(q)||p.code.toLowerCase().includes(q)));
                          return <div style={{position:'absolute',top:'100%',left:0,right:0,border:'1px solid var(--border)',borderRadius:6,background:'#fff',boxShadow:'0 4px 12px rgba(0,48,135,.1)',maxHeight:160,overflowY:'auto',zIndex:999}}>
                            {matches.length===0&&<div style={{padding:'8px 10px',fontSize:12,color:'var(--text3)'}}>لا يوجد نتائج</div>}
                            {matches.map(p=><div key={p.id}
                              onMouseDown={e=>{e.preventDefault();updateItem(i,'productId',String(p.id));setProdSearches(s=>({...s,[i]:''}));}}
                              style={{padding:'6px 10px',cursor:'pointer',fontSize:12,borderBottom:'1px solid var(--bg3)'}}
                              onMouseEnter={e=>e.currentTarget.style.background='var(--bg3)'}
                              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                              <span style={{fontWeight:600,color:'var(--primary)'}}>{p.code}</span> — {p.name}
                              <span style={{float:'right',color:'var(--text3)'}}>{p.category}</span>
                            </div>)}
                          </div>;
                        })()}
                      </div>}
                    </td>
                    <td><input className="li-input" type="number" min="1" style={{width:60}} value={item.qty||''} onChange={e=>updateItem(i,'qty',Number(e.target.value))}/></td>
                    <td><input className="li-input" type="number" min="0" value={item.unitPrice||''} onChange={e=>updateItem(i,'unitPrice',Number(e.target.value))}/></td>
                    <td style={{fontWeight:600,paddingLeft:8}}>{fmt((item.qty||0)*(item.unitPrice||0),form.currency)}</td>
                    <td><button className="btn btn-ghost btn-icon" style={{color:'var(--red)'}} onClick={()=>removeItem(i)}><Icon name="x" size={13}/></button></td>
                  </tr>
                ))}
                {(form.items||[]).length===0&&<tr><td colSpan="5" style={{textAlign:'center',padding:16,color:'var(--text3)',fontSize:13}}>{t.noItemsYet}</td></tr>}
              </tbody>
            </table>
          </div>
          <div style={{marginTop:14}}>
            <div className="form-grid cols-3">
              <FG label={`${t.discount} (%)`}><input className="form-input" type="number" min="0" max="100" value={form.discount||0} onChange={e=>setForm({...form,discount:Number(e.target.value)})}/></FG>
              <FG label={`${t.tax} (%)`}><input className="form-input" type="number" min="0" max="100" value={form.tax||0} onChange={e=>setForm({...form,tax:Number(e.target.value)})}/></FG>
              <div/>
            </div>
            <div style={{background:'var(--bg4)',border:'1px solid var(--border)',borderRadius:'var(--r)',padding:'12px 16px',marginTop:8,display:'flex',flexDirection:'column',gap:5}}>
              {[
                [t.subtotal, fmt(sub,form.currency),'var(--text2)'],
                form.discount>0?[`Discount (${form.discount}%)`,`−${fmt(disc,form.currency)}`,'var(--red)']:null,
                form.tax>0?[`VAT (${form.tax}%)`,fmt(taxAmt,form.currency),'var(--text2)']:null,
                [t.grandTotal, fmt(grand,form.currency),'var(--primary)'],
              ].filter(Boolean).map(([label,val,col],i,arr)=>(
                <div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:i===arr.length-1?15:13,fontWeight:i===arr.length-1?700:500,borderTop:i===arr.length-1?'1px solid var(--border)':0,paddingTop:i===arr.length-1?8:0,marginTop:i===arr.length-1?4:0}}>
                  <span style={{color:'var(--text2)'}}>{label}</span>
                  <span style={{color:col,fontFamily:'Rajdhani',letterSpacing:'0.3px'}}>{val}</span>
                </div>
              ))}
            </div>
          </div>
          <div style={{marginTop:14}}>
            <FG label={t.notes}><textarea className="form-textarea" value={form.notes||''} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="Internal notes..."/></FG>
          </div>
        </Modal>
      )}
      <Confirm open={!!deleteTarget} t={t} title={t.deleteConfirm} message={t.deleteMsg} onConfirm={del} onCancel={()=>setDeleteTarget(null)}/>

      {/* ── CUSTOMER QUICK VIEW MODAL ── */}
      {viewingCustomerOff && (()=>{
        const rep = data.users.find(u=>u.id===viewingCustomerOff.assignedTo);
        const coOffers = data.offers.filter(o=>o.customerId===viewingCustomerOff.id);
        const coOrders = data.orders.filter(o=>o.customerId===viewingCustomerOff.id);
        return (
          <Modal open={true} title={viewingCustomerOff.name} onClose={()=>setViewingCustomerOff(null)}>
            <div className="company-panel-header">
              <div className="company-panel-icon"><Icon name="building" size={22}/></div>
              <div>
                <div className="company-panel-name">{viewingCustomerOff.name}</div>
                <div className="company-panel-meta">
                  {viewingCustomerOff.code} &nbsp;·&nbsp; {viewingCustomerOff.industry} &nbsp;·&nbsp;
                  <Badge text={viewingCustomerOff.status} color={statusColor[viewingCustomerOff.status]||'gray'}/>
                  {rep && <span style={{marginLeft:8,color:'rgba(255,255,255,.8)'}}>👤 {rep.name}</span>}
                </div>
              </div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:14}}>
              {[
                {label:'Phone',val:viewingCustomerOff.phone},
                {label:'Email',val:viewingCustomerOff.email},
                {label:'Address',val:viewingCustomerOff.address},
              ].map(({label,val})=>(
                <div key={label} style={{background:'var(--bg3)',borderRadius:8,padding:'10px 12px'}}>
                  <div style={{fontSize:10,fontWeight:700,color:'var(--text3)',textTransform:'uppercase',letterSpacing:.5,marginBottom:3}}>{label}</div>
                  <div style={{fontSize:12,color:'var(--text)'}}>{val||'—'}</div>
                </div>
              ))}
            </div>
            <div style={{display:'flex',gap:12,fontSize:12,color:'var(--text2)'}}>
              <span>📋 {coOffers.length} {t.totalOffers}</span>
              <span>🛒 {coOrders.length} {t.totalOrders}</span>
            </div>
            {viewingCustomerOff.notes && <div className="info-box" style={{marginTop:12}}><Icon name="file" size={13}/> {viewingCustomerOff.notes}</div>}
          </Modal>
        );
      })()}
    </div>
  );
}

// ════════════════════════════════════════════════
//  ORDERS TAB
// ════════════════════════════════════════════════
function OrdersTab({ data, setData, user, t, showToast, handleApiError }) {
  const [search, setSearch] = useState('');
  const [filterStatus, setFilterStatus] = useState('');
  const [modal, setModal] = useState(null);
  const [deleteTarget, setDeleteTarget] = useState(null);
  const [orderProdSearches, setOrderProdSearches] = useState({});
  const [ordPage, setOrdPage] = useState(1);
  const [ordPageSize, setOrdPageSize] = useState(50);
  const isAdmin=user.role==='Admin', isManager=user.role==='Manager'||isAdmin;

  const statuses=['Pending','Processing','Shipped','Delivered','Cancelled'];
  const accCos=isManager?data.customers:data.customers.filter(c=>c.assignedTo===user.id);

  const filtered=data.orders.filter(o=>{
    const byRole=isManager||o.createdBy===user.id;
    const co=data.customers.find(c=>c.id===o.customerId);
    const bySearch=!search||o.orderNo.includes(search)||(co&&co.name.toLowerCase().includes(search.toLowerCase()));
    const bySt=!filterStatus||o.status===filterStatus;
    return byRole&&bySearch&&bySt;
  });

  const blank={orderNo:'',date:today(),customerId:'',offerId:'',currency:'EGP',discount:0,tax:14,status:'Pending',deliveryDate:'',paymentTerms:'Net 30',shippingAddress:'',notes:'',items:[]};
  const [form,setForm]=useState(blank);
  const addItem=()=>setForm(f=>({...f,items:[...f.items,{productId:'',productName:'',qty:1,unitPrice:0}]}));
  const removeItem=(i)=>setForm(f=>({...f,items:f.items.filter((_,j)=>j!==i)}));
  const updateItem=(i,field,val)=>setForm(f=>{
    const items=[...f.items];items[i]={...items[i],[field]:val};
    if(field==='productId'){const p=data.products.find(x=>x.id===Number(val));if(p){items[i].productName=p.name;items[i].unitPrice=f.currency==='USD'?p.priceUSD:p.priceEGP;}}
    return {...f,items};
  });
  const {sub,disc,afterDisc,taxAmt,grand}=calcOffer(form.items||[],form.discount,form.tax);
  const open=(mode,rec)=>{
    if(mode==='add'){const newNo=`ORD-${new Date().getFullYear()}-${String(nextId(data.orders)).padStart(3,'0')}`;setForm({...blank,orderNo:newNo,createdBy:user.id});}
    else setForm({...rec,items:[...rec.items.map(i=>({...i}))]});
    setOrderProdSearches({});
    setModal(mode);
  };
  const save = async () => {
    if(!form.customerId||(!(form.offerId)&&!form.items.length)) return;
    try {
      const payload = {...form, customerId:Number(form.customerId)};
      if(modal==='add'){
        const created = await apiFetch('POST', '/orders', payload);
        setData(d=>({...d, orders:[...d.orders, created]}));
      } else {
        const updated = await apiFetch('PUT', `/orders/${form.id}`, payload);
        setData(d=>({...d, orders:d.orders.map(o=>o.id===form.id?(updated||payload):o)}));
      }
      setModal(null); showToast(t.saved);
    } catch(e) { handleApiError(e); }
  };
  const del = async () => {
    try {
      await apiFetch('DELETE', `/orders/${deleteTarget}`);
      setData(d=>({...d, orders:d.orders.filter(o=>o.id!==deleteTarget)}));
      setDeleteTarget(null); showToast(t.deleted);
    } catch(e) { handleApiError(e); }
  };
  const payTerms=['Net 30','Net 60','Net 90','Cash on Delivery','100% Advance'];

  return (
    <div className="tab-content">
      <div className="section-header">
        <div><div className="section-title">{t.orders}</div><div className="section-subtitle">{filtered.length} {t.totalOrders}</div></div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-excel btn-sm" onClick={()=>{
            const rows=filtered.map(o=>{const co=data.customers.find(c=>c.id===o.customerId);const calc=calcOffer(o.items||[],o.discount,o.tax);return{OrderNo:o.orderNo,Date:o.date,Customer:co?.name||'',Currency:o.currency,Total:calc.grand,Status:o.status,DeliveryDate:o.deliveryDate||'',PaymentTerms:o.paymentTerms||'',ShippingAddress:o.shippingAddress||''};});
            exportToExcel(rows,'Orders','orders.xlsx').catch(()=>showToast('Export failed','error'));
          }}><Icon name="xls" size={14}/> Export</button>
          <button className="btn btn-primary" onClick={()=>open('add')}><Icon name="plus" size={15}/> {t.addOrder}</button>
        </div>
      </div>
      <div className="toolbar">
        <div className="search-box"><span className="search-icon"><Icon name="search" size={15}/></span><input className="search-input" placeholder={t.search} value={search} onChange={e=>setSearch(e.target.value)}/></div>
        <select className="filter-select" value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
          <option value="">{t.filterStatus}</option>
          {statuses.map(s=>{const k=s.toLowerCase().replace(/ /g,'');return <option key={s} value={s}>{t[k]||s}</option>;})}
        </select>
      </div>
      <div className="table-wrap">
        <table className="table">
          <thead><tr><th>{t.orderNo}</th><th>{t.date}</th><th>{t.customer}</th><th>{t.linkedOffer}</th><th>{t.grandTotal}</th><th>{t.status}</th><th>{t.deliveryDate}</th><th>{t.actions}</th></tr></thead>
          <tbody>
            {filtered.length===0?<tr><td colSpan="8"><EmptyState t={t}/></td></tr>:
            filtered.slice((ordPage-1)*ordPageSize, ordPage*ordPageSize).map(o=>{
              const co=data.customers.find(c=>c.id===o.customerId);
              const offer=data.offers.find(x=>x.id===o.offerId);
              const calc=calcOffer(o.items||[],o.discount,o.tax);
              return (
                <tr key={o.id}>
                  <td><span className="cell-code">{o.orderNo}</span></td>
                  <td style={{fontSize:13}}>{o.date}</td>
                  <td><span style={{fontSize:13}}>{co?.name||'—'}</span></td>
                  <td>{offer?<span className="cell-code">{offer.offerNo}</span>:<span style={{color:'var(--text3)'}}>—</span>}</td>
                  <td><span className="price-cell">{fmt(calc.afterDisc,o.currency)}</span></td>
                  <td><Badge text={o.status} color={statusColor[o.status]||'gray'}/></td>
                  <td style={{fontSize:12}}>{o.deliveryDate||'—'}</td>
                  <td><div className="table-actions">
                    <button className="btn btn-ghost btn-sm btn-icon" onClick={()=>open('edit',o)}><Icon name="edit" size={14}/></button>
                    {isManager&&<button className="btn btn-ghost btn-sm btn-icon" style={{color:'var(--red)'}} onClick={()=>setDeleteTarget(o.id)}><Icon name="trash" size={14}/></button>}
                  </div></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <Pagination total={filtered.length} page={ordPage} pageSize={ordPageSize} onPage={(p)=>setOrdPage(p)} onPageSize={(s)=>{setOrdPageSize(s);setOrdPage(1);}}/>
      {(modal==='add'||modal==='edit')&&(
        <Modal open={true} title={modal==='add'?t.addOrder:t.editOrder} onClose={()=>setModal(null)} large
          footer={<><button className="btn btn-secondary" onClick={()=>setModal(null)}>{t.cancel}</button><button className="btn btn-primary" onClick={save}>{t.save}</button></>}>
          <div className="form-grid cols-3">
            <FG label={t.orderNo}><input className="form-input" value={form.orderNo||''} onChange={e=>setForm({...form,orderNo:e.target.value})}/></FG>
            <FG label={t.date}><input className="form-input" type="date" value={form.date||''} onChange={e=>setForm({...form,date:e.target.value})}/></FG>
            <FG label={t.status}>
              <select className="form-select" value={form.status||'Pending'} onChange={e=>setForm({...form,status:e.target.value})}>
                {statuses.map(s=><option key={s}>{s}</option>)}
              </select>
            </FG>
            <FG label={t.customer} span={2}>
              <select className="form-select" value={form.customerId||''} onChange={e=>setForm({...form,customerId:Number(e.target.value)})}>
                <option value="">— Select Customer —</option>
                {accCos.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </FG>
            <FG label={t.currency}>
              <select className="form-select" value={form.currency||'EGP'} onChange={e=>setForm({...form,currency:e.target.value})}>
                <option value="EGP">EGP</option><option value="USD">USD</option>
              </select>
            </FG>
            <FG label={t.deliveryDate}><input className="form-input" type="date" value={form.deliveryDate||''} onChange={e=>setForm({...form,deliveryDate:e.target.value})}/></FG>
            <FG label={t.paymentTerms}>
              <select className="form-select" value={form.paymentTerms||'Net 30'} onChange={e=>setForm({...form,paymentTerms:e.target.value})}>
                {payTerms.map(p=><option key={p}>{p}</option>)}
              </select>
            </FG>
            <FG label={t.linkedOffer} span={3}>
              <select className="form-select" value={form.offerId||''} onChange={e=>{
                const selOffer = data.offers.find(o=>o.id===Number(e.target.value));
                if(selOffer){
                  setForm({...form, offerId:Number(e.target.value)||'', currency:selOffer.currency, discount:selOffer.discount, tax:selOffer.tax, items:[...selOffer.items.map(i=>({...i}))]});
                } else {
                  setForm({...form, offerId:'', items:[]});
                }
              }}>
                <option value="">— None (manual line items) —</option>
                {data.offers.filter(o=>Number(form.customerId)===o.customerId).map(o=>{
                  const already=data.orders.find(x=>x.offerId===o.id&&x.id!==form.id);
                  return <option key={o.id} value={o.id} disabled={!!already}>{o.offerNo} — {o.status}{already?' (already ordered)':''}</option>;
                })}
              </select>
            </FG>
            <FG label={t.shippingAddress} span={3}><input className="form-input" value={form.shippingAddress||''} onChange={e=>setForm({...form,shippingAddress:e.target.value})}/></FG>
          </div>
          <div className="divider"/>
          {/* ── If offer is linked: show reference card. If not: show manual line items ── */}
          {form.offerId ? (()=>{
            const linkedOffer = data.offers.find(o=>o.id===form.offerId);
            if(!linkedOffer) return null;
            const calc = calcOffer(linkedOffer.items||[], linkedOffer.discount, linkedOffer.tax);
            return (
              <div style={{background:'var(--primary-bg)',border:'1px solid rgba(0,48,135,.15)',borderRadius:'var(--r)',padding:'14px 18px',marginBottom:14}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <Icon name="file" size={16} style={{color:'var(--primary)'}}/>
                    <span style={{fontFamily:'Rajdhani',fontWeight:700,fontSize:15,color:'var(--primary)'}}>{linkedOffer.offerNo}</span>
                    <Badge text={linkedOffer.status} color={statusColor[linkedOffer.status]||'gray'}/>
                  </div>
                  <span style={{fontSize:12,color:'var(--text3)'}}>{linkedOffer.date}</span>
                </div>
                <div className="line-items-wrap">
                  <table className="li-table">
                    <thead><tr><th>#</th><th>{t.product}</th><th style={{width:70}}>{t.qty}</th><th style={{width:130}}>{t.unitPrice}</th><th style={{width:130}}>{t.lineTotal}</th></tr></thead>
                    <tbody>
                      {(linkedOffer.items||[]).map((item,i)=>(
                        <tr key={i}>
                          <td style={{color:'var(--text3)',width:30,fontSize:12}}>{i+1}</td>
                          <td style={{fontSize:13}}>{item.productName||'—'}</td>
                          <td style={{fontSize:13}}>{item.qty}</td>
                          <td style={{fontSize:13}}>{fmt(item.unitPrice,linkedOffer.currency)}</td>
                          <td style={{fontWeight:600,fontSize:13}}>{fmt((item.qty||0)*(item.unitPrice||0),linkedOffer.currency)}</td>
                        </tr>
                      ))}
                      {linkedOffer.discount>0&&<tr className="li-total"><td colSpan="4" style={{textAlign:'right',paddingRight:12,color:'var(--text2)',fontSize:12}}>Discount ({linkedOffer.discount}%)</td><td style={{color:'var(--red)',fontSize:12}}>−{fmt(calc.disc,linkedOffer.currency)}</td></tr>}
                      {linkedOffer.tax>0&&<tr className="li-total"><td colSpan="4" style={{textAlign:'right',paddingRight:12,color:'var(--text2)',fontSize:12}}>VAT ({linkedOffer.tax}%)</td><td style={{fontSize:12}}>{fmt(calc.taxAmt,linkedOffer.currency)}</td></tr>}
                      <tr className="li-total"><td colSpan="4" style={{textAlign:'right',paddingRight:12,fontSize:14,fontWeight:700}}>{t.grandTotal}</td><td style={{fontSize:15,color:'var(--primary)',fontFamily:'Rajdhani',fontWeight:700}}>{fmt(calc.grand,linkedOffer.currency)}</td></tr>
                    </tbody>
                  </table>
                </div>
                <div style={{marginTop:8,fontSize:11,color:'var(--text3)',display:'flex',alignItems:'center',gap:4}}>
                  <Icon name="info" size={12}/> {t.offerReferenceHint||'Line items are sourced from the linked offer and cannot be edited here.'}
                </div>
              </div>
            );
          })() : (
            <>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                <span style={{fontWeight:700,fontSize:12,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'0.5px'}}>{t.lineItems}</span>
                <button className="btn btn-secondary btn-sm" onClick={addItem}>{t.addItem}</button>
              </div>
              <div className="line-items-wrap">
                <table className="li-table">
                  <thead><tr><th>{t.product}</th><th style={{width:70}}>{t.qty}</th><th style={{width:140}}>{t.unitPrice}</th><th style={{width:130}}>{t.lineTotal}</th><th style={{width:40}}></th></tr></thead>
                  <tbody>
                    {(form.items||[]).map((item,i)=>(
                      <tr key={i}>
                        <td style={{position:'relative'}}>
                          {item.productId ? (()=>{
                            const sel=data.products.find(p=>p.id===Number(item.productId));
                            return <div style={{display:'flex',alignItems:'center',gap:6}}>
                              <span style={{flex:1,fontSize:12,fontWeight:600,color:'var(--text)'}}>{sel?`${sel.code} — ${sel.name}`:'?'}</span>
                              <button style={{background:'none',border:'none',cursor:'pointer',color:'var(--red)',fontSize:16}} onClick={()=>{updateItem(i,'productId','');setOrderProdSearches(s=>({...s,[i]:''}));}}>×</button>
                            </div>;
                          })() : <div style={{position:'relative'}}>
                            <input className="li-input" placeholder="🔍 ابحث عن منتج..." style={{width:'100%'}}
                              value={orderProdSearches[i]||''} onChange={e=>setOrderProdSearches(s=>({...s,[i]:e.target.value}))} autoComplete="off"/>
                            {(orderProdSearches[i]||'').length>0 && (()=>{
                              const q=(orderProdSearches[i]||'').toLowerCase();
                              const matches=data.products.filter(p=>p.active&&(p.name.toLowerCase().includes(q)||p.code.toLowerCase().includes(q)));
                              return <div style={{position:'absolute',top:'100%',left:0,right:0,border:'1px solid var(--border)',borderRadius:6,background:'#fff',boxShadow:'0 4px 12px rgba(0,48,135,.1)',maxHeight:160,overflowY:'auto',zIndex:999}}>
                                {matches.length===0&&<div style={{padding:'8px 10px',fontSize:12,color:'var(--text3)'}}>لا يوجد نتائج</div>}
                                {matches.map(p=><div key={p.id}
                                  onMouseDown={e=>{e.preventDefault();updateItem(i,'productId',String(p.id));setOrderProdSearches(s=>({...s,[i]:''}));}}
                                  style={{padding:'6px 10px',cursor:'pointer',fontSize:12,borderBottom:'1px solid var(--bg3)'}}
                                  onMouseEnter={e=>e.currentTarget.style.background='var(--bg3)'}
                                  onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                                  <span style={{fontWeight:600,color:'var(--primary)'}}>{p.code}</span> — {p.name}
                                  <span style={{float:'right',color:'var(--text3)'}}>{p.category}</span>
                                </div>)}
                              </div>;
                            })()}
                          </div>}
                        </td>
                        <td><input className="li-input" type="number" min="1" style={{width:60}} value={item.qty||''} onChange={e=>updateItem(i,'qty',Number(e.target.value))}/></td>
                        <td><input className="li-input" type="number" min="0" value={item.unitPrice||''} onChange={e=>updateItem(i,'unitPrice',Number(e.target.value))}/></td>
                        <td style={{fontWeight:600,paddingLeft:8}}>{fmt((item.qty||0)*(item.unitPrice||0),form.currency)}</td>
                        <td><button className="btn btn-ghost btn-icon" style={{color:'var(--red)'}} onClick={()=>removeItem(i)}><Icon name="x" size={13}/></button></td>
                      </tr>
                    ))}
                    {(form.items||[]).length===0&&<tr><td colSpan="5" style={{textAlign:'center',padding:16,color:'var(--text3)',fontSize:13}}>{t.noItemsYet}</td></tr>}
                  </tbody>
                </table>
              </div>
              <div style={{marginTop:14}}>
                <div className="form-grid cols-3">
                  <FG label={`${t.discount} (%)`}><input className="form-input" type="number" min="0" max="100" value={form.discount||0} onChange={e=>setForm({...form,discount:Number(e.target.value)})}/></FG>
                  <FG label={`${t.tax} (%)`}><input className="form-input" type="number" min="0" max="100" value={form.tax||0} onChange={e=>setForm({...form,tax:Number(e.target.value)})}/></FG>
                  <div/>
                </div>
                <div style={{background:'var(--bg4)',border:'1px solid var(--border)',borderRadius:'var(--r)',padding:'12px 16px',marginTop:8,display:'flex',flexDirection:'column',gap:5}}>
                  {[[t.subtotal,fmt(sub,form.currency),'var(--text2)'],[t.grandTotal,fmt(grand,form.currency),'var(--primary)']].map(([l,v,c],i,a)=>(
                    <div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:i===a.length-1?15:13,fontWeight:i===a.length-1?700:500,borderTop:i===a.length-1?'1px solid var(--border)':0,paddingTop:i===a.length-1?8:0,marginTop:i===a.length-1?4:0}}><span style={{color:'var(--text2)'}}>{l}</span><span style={{color:c,fontFamily:'Rajdhani'}}>{v}</span></div>
                  ))}
                </div>
              </div>
            </>
          )}
          <div style={{marginTop:14}}>
            <FG label={t.notes}><textarea className="form-textarea" value={form.notes||''} onChange={e=>setForm({...form,notes:e.target.value})}/></FG>
          </div>
        </Modal>
      )}
      <Confirm open={!!deleteTarget} t={t} title={t.deleteConfirm} message={t.deleteMsg} onConfirm={del} onCancel={()=>setDeleteTarget(null)}/>
    </div>
  );
}

// ════════════════════════════════════════════════
//  PRICELIST TAB
// ════════════════════════════════════════════════
function PricelistTab({ data, setData, user, t, showToast, handleApiError }) {
  const [search, setSearch] = useState('');
  const [filterCat, setFilterCat] = useState('');
  const [modal, setModal] = useState(null);
  const [deleteTarget, setDeleteTarget] = useState(null);
  const isAdmin=user.role==='Admin', isManager=user.role==='Manager'||isAdmin;

  const cats=['Generator','Canopy','Tank','ATS','Trailer','Others'];
  const units=['Piece','Meter','Set','Box','KG','Liter'];

  const filtered=data.products.filter(p=>{
    const bySearch=!search||p.name.toLowerCase().includes(search.toLowerCase())||p.code.toLowerCase().includes(search.toLowerCase());
    const byCat=!filterCat||p.category===filterCat;
    return bySearch&&byCat;
  });

  const blank={code:'',name:'',category:'Generator',unit:'Piece',priceEGP:0,priceUSD:0,description:'',active:true};
  const [form,setForm]=useState(blank);
  const open=(mode,rec)=>{
    setForm(rec?{...rec}:{...blank,code:`P${String(nextId(data.products)).padStart(4,'0')}`});
    setModal(mode);
  };
  const save = async () => {
    if(!form.name) return;
    const payload = {...form, priceEGP:Number(form.priceEGP), priceUSD:Number(form.priceUSD)};
    try {
      if(modal==='add'){
        const created = await apiFetch('POST', '/products', payload);
        setData(d=>({...d, products:[...d.products, created]}));
      } else {
        const updated = await apiFetch('PUT', `/products/${form.id}`, payload);
        setData(d=>({...d, products:d.products.map(p=>p.id===form.id?(updated||payload):p)}));
      }
      setModal(null); showToast(t.saved);
    } catch(e) { handleApiError(e); }
  };
  const del = async () => {
    try {
      await apiFetch('DELETE', `/products/${deleteTarget}`);
      setData(d=>({...d, products:d.products.filter(p=>p.id!==deleteTarget)}));
      setDeleteTarget(null); showToast(t.deleted);
    } catch(e) { handleApiError(e); }
  };

  const priceImportRef = useRef();
  const handlePriceExport = async () => {
    const rows = filtered.map(p=>({
      Code:p.code, Name:p.name, Category:p.category||'', Unit:p.unit||'',
      PriceEGP:p.priceEGP, PriceUSD:p.priceUSD, Description:p.description||'', Active:p.active?'Yes':'No'
    }));
    exportToExcel(rows,'Products','products.xlsx').catch(()=>showToast('Export failed','error'));
  };
  const handlePriceImport = async (e) => {
    const file=e.target.files[0]; if(!file) return;
    try {
      const rows = await readExcelFile(file);
      const created = [];
      for (const r of rows) {
        try {
          const rec = {
            code: r.Code||r.code||'',
            name: r.Name||r.name||'(Unknown)',
            category: r.Category||r.category||'Other',
            unit: r.Unit||r.unit||'Piece',
            priceEGP: Number(r.PriceEGP||r.priceEGP||0),
            priceUSD: Number(r.PriceUSD||r.priceUSD||0),
            description: r.Description||r.description||'',
            active: String(r.Active||r.active||'yes').toLowerCase()!=='no',
          };
          const p = await apiFetch('POST', '/products', rec);
          created.push(p);
        } catch {}
      }
      setData(d=>({...d, products:[...d.products, ...created]}));
      showToast(`Imported ${created.length} products`);
    } catch { showToast('Import failed — check file format','error'); }
    e.target.value='';
  };

  return (
    <div className="tab-content">
      <div className="section-header">
        <div><div className="section-title">{t.pricelist}</div><div className="section-subtitle">{filtered.length} {t.productsCount}</div></div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-excel btn-sm" onClick={handlePriceExport}><Icon name="xls" size={14}/> Export</button>
          {isManager&&<><button className="btn btn-excel btn-sm" onClick={()=>priceImportRef.current.click()}><Icon name="upload" size={14}/> Import</button><input ref={priceImportRef} type="file" accept=".xlsx,.xls,.csv" className="import-file-input" onChange={handlePriceImport}/></>}
          {isManager&&<button className="btn btn-primary" onClick={()=>open('add')}><Icon name="plus" size={15}/> {t.addProduct}</button>}
        </div>
      </div>
      <div className="toolbar">
        <div className="search-box"><span className="search-icon"><Icon name="search" size={15}/></span><input className="search-input" placeholder={t.search} value={search} onChange={e=>setSearch(e.target.value)}/></div>
        <select className="filter-select" value={filterCat} onChange={e=>setFilterCat(e.target.value)}>
          <option value="">{t.filterCategory}</option>
          {cats.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      <div className="table-wrap">
        <table className="table">
          <thead><tr><th>{t.productCode}</th><th>{t.productName}</th><th>{t.category}</th><th>{t.unit}</th><th>{t.priceEGP}</th><th>{t.priceUSD}</th><th>{t.status}</th>{isManager&&<th>{t.actions}</th>}</tr></thead>
          <tbody>
            {filtered.length===0?<tr><td colSpan="8"><EmptyState t={t}/></td></tr>:
            filtered.map(p=>(
              <tr key={p.id}>
                <td><span className="cell-code">{p.code}</span></td>
                <td><div className="cell-main">{p.name}</div><div className="cell-sub">{p.description?.slice(0,50)}</div></td>
                <td><Badge text={p.category} color="blue"/></td>
                <td style={{fontSize:13,color:'var(--text2)'}}>{p.unit}</td>
                <td><span className="price-cell">{Number(p.priceEGP).toLocaleString('en')} EGP</span></td>
                <td><span className="price-cell">$ {Number(p.priceUSD).toFixed(2)}</span></td>
                <td><Badge text={p.active?'Active':'Inactive'} color={p.active?'green':'gray'}/></td>
                {isManager&&<td><div className="table-actions">
                  <button className="btn btn-ghost btn-sm btn-icon" onClick={()=>open('edit',p)}><Icon name="edit" size={14}/></button>
                  <button className="btn btn-ghost btn-sm btn-icon" style={{color:'var(--red)'}} onClick={()=>setDeleteTarget(p.id)}><Icon name="trash" size={14}/></button>
                </div></td>}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <Modal open={!!modal} title={modal==='add'?t.addProduct:t.editProduct} onClose={()=>setModal(null)}
        footer={<><button className="btn btn-secondary" onClick={()=>setModal(null)}>{t.cancel}</button><button className="btn btn-primary" onClick={save}>{t.save}</button></>}>
        <div className="form-grid">
          <FG label={t.productCode}><input className="form-input" value={form.code||''} onChange={e=>setForm({...form,code:e.target.value})}/></FG>
          <FG label={t.category}>
            <select className="form-select" value={form.category||'Generator'} onChange={e=>setForm({...form,category:e.target.value})}>
              {cats.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          </FG>
          <FG label={t.productName} span={2}><input className="form-input" value={form.name||''} onChange={e=>setForm({...form,name:e.target.value})}/></FG>
          <FG label={t.unit}>
            <select className="form-select" value={form.unit||'Piece'} onChange={e=>setForm({...form,unit:e.target.value})}>
              {units.map(u=><option key={u}>{u}</option>)}
            </select>
          </FG>
          <FG label={t.status}>
            <select className="form-select" value={form.active?'Active':'Inactive'} onChange={e=>setForm({...form,active:e.target.value==='Active'})}>
              <option>Active</option><option>Inactive</option>
            </select>
          </FG>
          <FG label={t.priceEGP}><input className="form-input" type="number" min="0" value={form.priceEGP||0} onChange={e=>setForm({...form,priceEGP:e.target.value})}/></FG>
          <FG label={t.priceUSD}><input className="form-input" type="number" min="0" step="0.01" value={form.priceUSD||0} onChange={e=>setForm({...form,priceUSD:e.target.value})}/></FG>
          <FG label={t.description} span={2}><textarea className="form-textarea" value={form.description||''} onChange={e=>setForm({...form,description:e.target.value})}/></FG>
        </div>
      </Modal>
      <Confirm open={!!deleteTarget} t={t} title={t.deleteConfirm} message={t.deleteMsg} onConfirm={del} onCancel={()=>setDeleteTarget(null)}/>
    </div>
  );
}

// ════════════════════════════════════════════════
//  COST SHEET TAB
// ════════════════════════════════════════════════
function CostSheetTab({ data, setData, user, t, showToast, handleApiError }) {
  const isManager = ['Admin','Manager'].includes(user.role);
  const [selOrderId, setSelOrderId] = useState('');
  const [sheet, setSheet] = useState(null);
  const [dirty, setDirty] = useState(false);

  const accessibleOrders = isManager
    ? [...data.orders].sort((a,b)=>b.id-a.id)
    : [...data.orders].filter(o=>o.createdBy===user.id).sort((a,b)=>b.id-a.id);

  const loadSheet = (orderId) => {
    setSelOrderId(orderId);
    setDirty(false);
    if(!orderId){ setSheet(null); return; }
    const oid = Number(orderId);
    const existing = data.costSheets.find(s=>s.orderId===oid);
    if(existing){
      setSheet({...existing, items:existing.items.map(i=>({...i})), extraCosts:existing.extraCosts.map(c=>({...c}))});
    } else {
      const order = data.orders.find(o=>o.id===oid);
      // Prefer linked offer items for selling price reference; fallback to order items
      const offerSrc = order?.offerId ? data.offers.find(f=>f.id===order.offerId) : null;
      const srcItems = offerSrc ? offerSrc.items||[] : (order?.items||[]);
      setSheet({
        orderId: oid,
        currency: order?.currency||'EGP',
        items: srcItems.map(i=>({
          productId: i.productId, productName: i.productName||'—',
          qty: i.qty||1, sellingPrice: Number(i.unitPrice)||0, costPrice: 0,
        })),
        extraCosts:[
          {name: t.transportation||'Transportation', amount:0},
          {name: t.customs||'Customs / Duties',      amount:0},
          {name: t.installation||'Installation',     amount:0},
        ]
      });
    }
  };

  const saveSheet = async () => {
    if(!sheet) return;
    try {
      const existing = data.costSheets.find(s=>s.orderId===sheet.orderId);
      if(existing){
        const updated = await apiFetch('PUT', `/costsheets/${existing.id}`, sheet);
        const arr = data.costSheets.map(s=>s.orderId===sheet.orderId?(updated||sheet):s);
        setData(d=>({...d, costSheets:arr}));
      } else {
        const created = await apiFetch('POST', '/costsheets', sheet);
        setData(d=>({...d, costSheets:[...d.costSheets, created||sheet]}));
      }
      setDirty(false);
      showToast(t.saved);
    } catch(e) { handleApiError(e); }
  };

  const markDirty = (newSheet) => { setSheet(newSheet); setDirty(true); };
  const updateItem   = (i,f,v) => { const it=[...sheet.items]; it[i]={...it[i],[f]:Number(v)||0}; markDirty({...sheet,items:it}); };
  const updateExtra  = (i,f,v) => { const ex=[...sheet.extraCosts]; ex[i]={...ex[i],[f]:f==='amount'?(Number(v)||0):v}; markDirty({...sheet,extraCosts:ex}); };
  const addExtra     = () => markDirty({...sheet,extraCosts:[...sheet.extraCosts,{name:'',amount:0}]});
  const removeExtra  = (i) => markDirty({...sheet,extraCosts:sheet.extraCosts.filter((_,j)=>j!==i)});

  const sum = sheet ? (() => {
    const totalRev   = sheet.items.reduce((s,i)=>s+(i.qty||0)*(i.sellingPrice||0),0);
    const totalCost  = sheet.items.reduce((s,i)=>s+(i.qty||0)*(i.costPrice||0),0);
    const grossProfit= totalRev - totalCost;
    const totalExtra = sheet.extraCosts.reduce((s,c)=>s+(c.amount||0),0);
    const netProfit  = grossProfit - totalExtra;
    const margin     = totalRev>0 ? (netProfit/totalRev)*100 : 0;
    const grossMargin= totalRev>0 ? (grossProfit/totalRev)*100 : 0;
    return {totalRev,totalCost,grossProfit,totalExtra,netProfit,margin,grossMargin,cur:sheet.currency||'EGP'};
  })() : {};

  const fmtV = (n,cur='EGP') => cur==='USD'
    ? `$ ${Math.abs(n).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})}`
    : `${Math.abs(n).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})} EGP`;

  const selectedOrder = data.orders.find(o=>o.id===Number(selOrderId));

  const printSheet = () => {
    if(!sheet||!selectedOrder) return;
    const co = data.customers.find(c=>c.id===selectedOrder.customerId);
    const rows = sheet.items.map(item=>{
      const pu=(item.sellingPrice||0)-(item.costPrice||0);
      return `<tr><td>${item.productName}</td><td style="text-align:center">${item.qty}</td><td>${fmtV(item.sellingPrice,sum.cur)}</td><td>${fmtV(item.costPrice,sum.cur)}</td><td style="color:${pu<0?'#D13438':'#0A8F5C'};font-weight:700">${pu<0?'−':'+'}${fmtV(Math.abs(pu),sum.cur)}</td><td>${fmtV((item.qty||0)*pu,sum.cur)}</td></tr>`;
    }).join('');
    const extras = sheet.extraCosts.filter(e=>e.name||e.amount>0).map(e=>`<tr><td>${e.name}</td><td colspan="5" style="text-align:right;color:#D13438">− ${fmtV(e.amount,sum.cur)}</td></tr>`).join('');
    const w = window.open('','_blank');
    w.document.write(`<!DOCTYPE html><html><head><title>Cost Sheet — ${selectedOrder.orderNo}</title>
    <style>body{font-family:Arial,sans-serif;padding:30px;color:#0D1E38}h2{color:#003087}table{width:100%;border-collapse:collapse;margin:16px 0}th{background:#003087;color:#fff;padding:8px 10px;text-align:left;font-size:12px}td{padding:7px 10px;border-bottom:1px solid #D5E0EF;font-size:13px}.summary{background:#F0F4FA;border-radius:8px;padding:16px;margin-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kpi{background:#fff;border-radius:6px;padding:12px;border-left:4px solid #003087}.kpi-label{font-size:10px;color:#4D6A8A;font-weight:700;text-transform:uppercase}.kpi-val{font-size:18px;font-weight:700;margin-top:4px}@media print{body{padding:0}}</style>
    </head><body>
    <h2>Cost Sheet — ${selectedOrder.orderNo}</h2>
    <div style="color:#4D6A8A;font-size:13px;margin-bottom:20px">${co?.name||''} &nbsp;·&nbsp; ${selectedOrder.date} &nbsp;·&nbsp; ${selectedOrder.status}</div>
    <table><thead><tr><th>Product</th><th>Qty</th><th>Selling Price</th><th>Cost Price</th><th>Profit/Unit</th><th>Total Profit</th></tr></thead><tbody>${rows}</tbody></table>
    ${extras?`<table><thead><tr><th colspan="6">Additional Costs</th></tr></thead><tbody>${extras}</tbody></table>`:''}
    <div class="summary">
      <div class="kpi" style="border-color:#003087"><div class="kpi-label">Total Revenue</div><div class="kpi-val" style="color:#003087">${fmtV(sum.totalRev,sum.cur)}</div></div>
      <div class="kpi" style="border-color:#D13438"><div class="kpi-label">Total Cost</div><div class="kpi-val" style="color:#D13438">${fmtV(sum.totalCost,sum.cur)}</div></div>
      <div class="kpi" style="border-color:#0A8F5C"><div class="kpi-label">Net Profit</div><div class="kpi-val" style="color:${sum.netProfit<0?'#D13438':'#0A8F5C'}">${sum.netProfit<0?'−':''}${fmtV(sum.netProfit,sum.cur)}</div></div>
    </div>
    <div style="margin-top:16px;font-size:12px;color:#8FAABF">Net Margin: ${sum.margin.toFixed(1)}% &nbsp;·&nbsp; Gross Margin: ${sum.grossMargin.toFixed(1)}%</div>
    <script>window.print();<\/script></body></html>`);
    w.document.close();
  };

  return (
    <div className="tab-content">
      <div className="section-header">
        <div>
          <div className="section-title">{t.costSheet||'Cost Sheet'}</div>
          <div className="section-subtitle">{data.costSheets.length} {t.costSheets||'sheets'}</div>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {sheet && <button className="btn btn-secondary" onClick={printSheet} title="Print / Export"><Icon name="eye" size={14}/> Print</button>}
          {sheet && dirty && <button className="btn btn-primary" onClick={saveSheet}><Icon name="check" size={15}/> {t.save}</button>}
          {sheet && !dirty && data.costSheets.find(s=>s.orderId===sheet.orderId) && <span className="badge badge-green" style={{alignSelf:'center'}}>✓ Saved</span>}
        </div>
      </div>

      {/* Order selector */}
      <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--r2)',padding:'14px 18px',marginBottom:20,display:'flex',alignItems:'center',gap:14,flexWrap:'wrap',boxShadow:'0 1px 6px rgba(0,48,135,.06)'}}>
        <Icon name="cart" size={16}/>
        <label className="form-label" style={{margin:0,whiteSpace:'nowrap'}}>{t.selectOrder||'Select Order'}</label>
        <select className="form-select" style={{maxWidth:400,flex:1}} value={selOrderId} onChange={e=>loadSheet(e.target.value)}>
          <option value="">— {t.selectOrder||'Select Order'} —</option>
          {accessibleOrders.map(o=>{
            const co=data.customers.find(c=>c.id===o.customerId);
            const has=data.costSheets.find(s=>s.orderId===o.id);
            return <option key={o.id} value={o.id}>{has?'✓ ':''}{o.orderNo} — {co?.name||'?'} ({o.status})</option>;
          })}
        </select>
        {selectedOrder&&<><span className={`badge badge-${({Delivered:'green',Processing:'blue',Pending:'yellow',Shipped:'orange',Cancelled:'red'})[selectedOrder.status]||'gray'}`}>{selectedOrder.status}</span><span style={{fontSize:12,color:'var(--text3)'}}>{selectedOrder.date}</span></>}
      </div>

      {!sheet ? (
        <div className="empty-state">
          <div className="empty-icon"><Icon name="calc" size={24}/></div>
          <div className="empty-title">{t.noOrderSelected||'Select an order to view or create its cost sheet.'}</div>
          <div className="empty-sub">Cost sheets are linked to orders and saved per order.</div>
        </div>
      ) : (
        <>
          {/* ── Items table ── */}
          <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--r2)',overflow:'hidden',marginBottom:16,boxShadow:'0 1px 6px rgba(0,48,135,.06)'}}>
            <div style={{background:'var(--bg3)',padding:'10px 16px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:8}}>
              <Icon name="pkg" size={15}/>
              <span style={{fontWeight:700,fontSize:11,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.5px'}}>Line Items — Cost Analysis</span>
              <span style={{marginLeft:'auto',fontSize:11,color:'var(--text3)'}}>Currency: {sum.cur}</span>
            </div>
            <div style={{overflowX:'auto'}}>
              <table className="table" style={{minWidth:860}}>
                <thead><tr>
                  <th style={{minWidth:200}}>{t.product||'Product'}</th>
                  <th style={{width:65,textAlign:'center'}}>{t.qty||'Qty'}</th>
                  <th style={{width:155}}>{t.sellingPrice||'Selling Price'} ▾</th>
                  <th style={{width:155}}>{t.costPrice||'Cost Price'} ▾</th>
                  <th style={{width:125}}>{t.profitPerUnit||'Profit / Unit'}</th>
                  <th style={{width:140}}>Revenue</th>
                  <th style={{width:140}}>Profit</th>
                  <th style={{width:80,textAlign:'right',paddingRight:12}}>Margin</th>
                </tr></thead>
                <tbody>
                  {sheet.items.length===0 && <tr><td colSpan="8" style={{textAlign:'center',padding:20,color:'var(--text3)'}}>No items — add items to the order first.</td></tr>}
                  {sheet.items.map((item,i)=>{
                    const pu   = (item.sellingPrice||0)-(item.costPrice||0);
                    const rev  = (item.qty||0)*(item.sellingPrice||0);
                    const prof = (item.qty||0)*pu;
                    const mgn  = item.sellingPrice>0 ? (pu/item.sellingPrice)*100 : 0;
                    const neg  = pu<0;
                    return (
                      <tr key={i} style={{background: neg?'rgba(209,52,56,.03)':''}}>
                        <td>
                          <div style={{fontWeight:600,fontSize:13}}>{item.productName||'—'}</div>
                          {item.productId && <div style={{fontSize:10,color:'var(--text3)',marginTop:1}}>ID: {item.productId}</div>}
                        </td>
                        <td style={{textAlign:'center',fontWeight:700,fontSize:14,fontFamily:'Rajdhani'}}>{item.qty}</td>
                        <td>
                          <input className="li-input" type="number" min="0" step="0.01"
                            value={item.sellingPrice||0} onChange={e=>updateItem(i,'sellingPrice',e.target.value)}
                            style={{width:'100%'}}/>
                        </td>
                        <td>
                          <input className="li-input" type="number" min="0" step="0.01"
                            value={item.costPrice||0} onChange={e=>updateItem(i,'costPrice',e.target.value)}
                            style={{width:'100%',borderColor:neg?'var(--red)':item.costPrice>0?'var(--green)':'var(--border)'}}/>
                        </td>
                        <td>
                          <span style={{fontWeight:700,color:neg?'var(--red)':'var(--green)',fontFamily:'Rajdhani',fontSize:14}}>
                            {neg?'−':'+'}
                            {Math.abs(pu).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})}
                          </span>
                        </td>
                        <td style={{fontFamily:'Rajdhani',fontWeight:600,fontSize:13,color:'var(--primary)'}}>
                          {rev.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})}
                        </td>
                        <td style={{fontFamily:'Rajdhani',fontWeight:700,fontSize:13,color:prof<0?'var(--red)':'var(--green)'}}>
                          {prof<0?'−':''}{Math.abs(prof).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})}
                        </td>
                        <td style={{textAlign:'right',paddingRight:12}}>
                          <span style={{
                            display:'inline-block',padding:'2px 7px',borderRadius:12,fontSize:11,fontWeight:700,
                            background:neg?'var(--red-bg)':mgn>30?'var(--green-bg)':'var(--yellow-bg)',
                            color:neg?'var(--red)':mgn>30?'var(--green)':'var(--yellow)',
                          }}>{mgn.toFixed(1)}%</span>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,alignItems:'start'}}>
            {/* ── Extra costs ── */}
            <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--r2)',overflow:'hidden',boxShadow:'0 1px 6px rgba(0,48,135,.06)'}}>
              <div style={{background:'var(--bg3)',padding:'10px 16px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <Icon name="truck" size={15}/>
                  <span style={{fontWeight:700,fontSize:11,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.5px'}}>{t.extraCosts||'Additional Costs'}</span>
                </div>
                <button className="btn btn-secondary btn-sm" onClick={addExtra}>{t.addExtraCost||'+ Add Row'}</button>
              </div>
              <table className="table">
                <thead><tr>
                  <th>{t.extraCostName||'Cost Item'}</th>
                  <th style={{width:180}}>{t.extraCostAmt||'Amount'} ({sum.cur})</th>
                  <th style={{width:44}}></th>
                </tr></thead>
                <tbody>
                  {sheet.extraCosts.map((ec,i)=>(
                    <tr key={i}>
                      <td><input className="li-input" style={{width:'100%'}} value={ec.name}
                        onChange={e=>updateExtra(i,'name',e.target.value)} placeholder="e.g. Freight, Customs…"/></td>
                      <td><input className="li-input" type="number" min="0" step="0.01"
                        value={ec.amount||0} onChange={e=>updateExtra(i,'amount',e.target.value)}/></td>
                      <td><button className="btn btn-ghost btn-icon" style={{color:'var(--red)'}} onClick={()=>removeExtra(i)}><Icon name="x" size={13}/></button></td>
                    </tr>
                  ))}
                  {sheet.extraCosts.length===0&&<tr><td colSpan="3" style={{textAlign:'center',padding:14,color:'var(--text3)',fontSize:13}}>No additional costs</td></tr>}
                  {sheet.extraCosts.length>0&&(
                    <tr style={{background:'var(--bg4)'}}>
                      <td style={{fontWeight:700,fontSize:12,color:'var(--text2)'}}>TOTAL EXTRA</td>
                      <td style={{fontFamily:'Rajdhani',fontWeight:700,color:'var(--red)',fontSize:14}}>
                        − {sum.totalExtra.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})} {sum.cur}
                      </td>
                      <td/>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>

            {/* ── P&L Summary ── */}
            <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--r2)',overflow:'hidden',boxShadow:'0 1px 6px rgba(0,48,135,.06)'}}>
              <div style={{background:'var(--primary)',padding:'10px 16px',borderBottom:'1px solid rgba(255,255,255,.15)',display:'flex',alignItems:'center',gap:8}}>
                <Icon name="calc" size={15}/>
                <span style={{fontWeight:700,fontSize:11,color:'#fff',textTransform:'uppercase',letterSpacing:'.5px'}}>P&amp;L Summary</span>
              </div>
              <div style={{padding:'4px 0'}}>
                {[
                  {label:'Total Revenue',          val:sum.totalRev,    color:'var(--primary)',  sign:''},
                  {label:'Total Direct Cost',       val:sum.totalCost,   color:'var(--red)',      sign:'−', sub:true},
                  {label:'Gross Profit',            val:sum.grossProfit, color:sum.grossProfit<0?'var(--red)':'var(--green)', sign:'', bold:true, top:true},
                  {label:`Gross Margin`,            val:null,            color:sum.grossMargin<0?'var(--red)':'var(--sky)',   isPct:true, pct:sum.grossMargin},
                  {label:'Additional Costs',        val:sum.totalExtra,  color:'var(--yellow)',   sign:'−', sub:true},
                  {label:'Net Profit',              val:sum.netProfit,   color:sum.netProfit<0?'var(--red)':'var(--green)',   sign:'', bold:true, top:true, big:true},
                  {label:'Net Margin',              val:null,            color:sum.margin<0?'var(--red)':'var(--sky)',        isPct:true, pct:sum.margin, big:true},
                ].map((row,i)=>(
                  <div key={i} style={{
                    display:'flex',justifyContent:'space-between',alignItems:'center',
                    padding:row.big?'14px 18px':'10px 18px',
                    borderTop:row.top?'2px solid var(--border)':'1px solid var(--border)',
                    background:row.big?(sum.netProfit<0?'var(--red-bg)':'var(--green-bg)'):'transparent',
                  }}>
                    <span style={{fontSize:row.bold?13:12,fontWeight:row.bold?700:500,color:row.sub?'var(--text3)':'var(--text)',paddingLeft:row.sub?12:0}}>{row.label}</span>
                    {row.isPct
                      ? <span style={{fontFamily:'Rajdhani',fontWeight:700,fontSize:row.big?18:14,color:row.color}}>{row.pct.toFixed(1)}%</span>
                      : <span style={{fontFamily:'Rajdhani',fontWeight:row.bold?700:600,fontSize:row.big?20:row.bold?16:14,color:row.color}}>
                          {row.sign}{row.sign===''&&row.val<0?'−':''}{Math.abs(row.val).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})} {sum.cur}
                        </span>
                    }
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* ── KPI cards ── */}
          <div className="cost-summary-grid" style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14,marginTop:16}}>
            {[
              {label:t.totalRevenue||'Revenue',    val:sum.totalRev,    color:'var(--primary)', pct:null},
              {label:t.grossProfit||'Gross Profit',val:sum.grossProfit, color:sum.grossProfit<0?'var(--red)':'var(--green)', pct:`${sum.grossMargin.toFixed(1)}% gross`},
              {label:t.netProfit||'Net Profit',    val:sum.netProfit,   color:sum.netProfit<0?'var(--red)':'var(--green)',   pct:`${sum.margin.toFixed(1)}% net`},
            ].map((card,i)=>(
              <div key={i} className="stat-card" style={{'--accent':card.color}}>
                <div className="stat-label">{card.label}</div>
                <div className="stat-value" style={{color:card.color,fontSize:18}}>
                  {card.val<0?'−':''}{Math.abs(card.val).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})}
                </div>
                <div className="stat-sub">{card.pct||sum.cur}</div>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

// ════════════════════════════════════════════════
//  TAX CALCULATOR TAB
// ════════════════════════════════════════════════
function TaxCalcTab({ data, setData, user, t, showToast, handleApiError }) {
  const isManager = ['Admin','Manager'].includes(user.role);
  // Sync rates from data.taxSettings (catches external saves)
  const [rates, setRates] = useState({...data.taxSettings});
  const [editing, setEditing] = useState(false);
  const [linkOrderId, setLinkOrderId] = useState('');
  const [baseAmount, setBaseAmount] = useState('');
  const [baseCur, setBaseCur] = useState('EGP');

  // Keep rates synced if another session updates data.taxSettings
  useEffect(()=>{ if(!editing) setRates({...data.taxSettings}); },[data.taxSettings]);

  const saveRates = async () => {
    try {
      await apiFetch('PUT', '/taxsettings', rates);
      setData(d=>({...d,taxSettings:{...rates}}));
      showToast(t.savedSettings||'Tax rates saved.');
      setEditing(false);
    } catch(e) { handleApiError(e); }
  };

  const handleLinkOrder = (orderId) => {
    setLinkOrderId(orderId);
    if(!orderId){ return; }
    const order = data.orders.find(o=>o.id===Number(orderId));
    if(!order) return;
    setBaseCur(order.currency||'EGP');
    const sheet = data.costSheets.find(s=>s.orderId===order.id);
    if(sheet){
      const totRev   = sheet.items.reduce((s,i)=>s+(i.qty||0)*(i.sellingPrice||0),0);
      const totCost  = sheet.items.reduce((s,i)=>s+(i.qty||0)*(i.costPrice||0),0);
      const totExtra = sheet.extraCosts.reduce((s,c)=>s+(c.amount||0),0);
      setBaseAmount(String(Math.max(0,Math.round(totRev-totCost-totExtra))));
    } else {
      const {grand} = calcOffer(order.items||[], order.discount, order.tax);
      setBaseAmount(String(Math.round(grand)));
    }
  };

  const base           = Number(baseAmount)||0;
  const vatAmt         = base*(rates.vat||0)/100;
  const withholdingAmt = base*(rates.withholding||0)/100;
  const incomeAmt      = base*(rates.income||0)/100;
  const totalTax       = withholdingAmt+incomeAmt;         // deducted taxes only (VAT is added)
  const totalTaxBurden = vatAmt+withholdingAmt+incomeAmt;  // all tax movement
  const netReceivable  = base+vatAmt-withholdingAmt-incomeAmt;
  const fmtN = n => n.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
  const fmtC = n => `${fmtN(Math.abs(n))} ${baseCur}`;
  const accessibleOrders = isManager ? data.orders : data.orders.filter(o=>o.createdBy===user.id);

  return (
    <div className="tab-content">
      <div className="section-header">
        <div>
          <div className="section-title">{t.taxCalc||'Tax Calculator'}</div>
          <div className="section-subtitle">VAT · Withholding · Income Tax</div>
        </div>
        {isManager && !editing && (
          <button className="btn btn-secondary" onClick={()=>setEditing(true)}><Icon name="edit" size={14}/> {t.taxSettings||'Edit Rates'}</button>
        )}
      </div>

      <div className="tax-two-col" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,alignItems:'start'}}>

        {/* ── LEFT COLUMN ── */}
        <div style={{display:'flex',flexDirection:'column',gap:16}}>

          {/* Rate Settings Card */}
          <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--r2)',overflow:'hidden',boxShadow:'0 1px 6px rgba(0,48,135,.06)'}}>
            <div style={{background:'var(--primary)',padding:'12px 18px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div style={{display:'flex',alignItems:'center',gap:8,color:'#fff'}}>
                <Icon name="percent" size={15}/>
                <span style={{fontWeight:700,fontSize:11,letterSpacing:'.5px',textTransform:'uppercase'}}>{t.taxSettings||'Tax Rate Settings'}</span>
              </div>
              {editing && isManager && (
                <div style={{display:'flex',gap:8}}>
                  <button className="btn btn-sm" style={{background:'var(--gold)',color:'var(--primary)',fontWeight:700}} onClick={saveRates}>{t.save}</button>
                  <button className="btn btn-sm btn-ghost" style={{color:'rgba(255,255,255,.7)'}} onClick={()=>{setRates({...data.taxSettings});setEditing(false);}}>{t.cancel}</button>
                </div>
              )}
            </div>
            <div style={{padding:'16px 18px',display:'flex',flexDirection:'column',gap:10}}>
              {[
                {key:'vat',        label:t.vatRate||'VAT (القيمة المضافة)',          color:'var(--sky)',    arNote:'يُضاف للمبلغ (+)'},
                {key:'withholding',label:t.withholdingRate||'Withholding (تحت حساب)',color:'var(--yellow)', arNote:'يُخصم من المبلغ (−)'},
                {key:'income',     label:t.incomeRate||'Income Tax (ضريبة الدخل)',   color:'var(--red)',    arNote:'يُخصم من المبلغ (−)'},
              ].map(({key,label,color,arNote})=>(
                <div key={key} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',background:'var(--bg3)',borderRadius:'var(--r)',border:'1px solid var(--border)'}}>
                  <div style={{width:4,height:40,background:color,borderRadius:3,flexShrink:0}}/>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:13,color:'var(--text)'}}>{label}</div>
                    <div style={{fontSize:11,color:'var(--text3)',marginTop:1}}>{arNote}</div>
                  </div>
                  {editing && isManager ? (
                    <input className="form-input" type="number" min="0" max="100" step="0.01"
                      value={rates[key]??0} onChange={e=>setRates({...rates,[key]:Number(e.target.value)||0})}
                      style={{width:88,textAlign:'center',fontFamily:'Rajdhani',fontWeight:700,fontSize:16,borderColor:color}}/>
                  ) : (
                    <div style={{fontFamily:'Rajdhani',fontWeight:700,fontSize:24,color,minWidth:68,textAlign:'right'}}>
                      {rates[key]??0}%
                    </div>
                  )}
                </div>
              ))}
              {!isManager && <div style={{fontSize:11,color:'var(--text3)',paddingTop:4,display:'flex',alignItems:'center',gap:5}}><Icon name="info" size={12}/>Only Managers and Admins can edit tax rates.</div>}
            </div>
          </div>

          {/* Amount Input Card */}
          <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--r2)',padding:'16px 18px',boxShadow:'0 1px 6px rgba(0,48,135,.06)'}}>
            <div style={{fontWeight:700,fontSize:11,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:14,display:'flex',alignItems:'center',gap:6}}>
              <Icon name="calc" size={14}/> {t.calcResults||'Enter Amount'}
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:12}}>
              <div className="form-group">
                <label className="form-label">{t.linkToOrder||'Link to Order (optional)'}</label>
                <select className="form-select" value={linkOrderId} onChange={e=>handleLinkOrder(e.target.value)}>
                  <option value="">— Manual Entry —</option>
                  {accessibleOrders.map(o=>{
                    const co=data.customers.find(c=>c.id===o.customerId);
                    const hasCostSheet=data.costSheets.find(s=>s.orderId===o.id);
                    return <option key={o.id} value={o.id}>{o.orderNo} — {co?.name||'?'}{hasCostSheet?' (from cost sheet)':''}</option>;
                  })}
                </select>
                {linkOrderId && <div style={{fontSize:11,color:'var(--text3)',marginTop:4,display:'flex',gap:4}}><Icon name="info" size={11}/>
                  {data.costSheets.find(s=>s.orderId===Number(linkOrderId)) ? 'Amount loaded from saved cost sheet net profit.' : 'Amount loaded from order grand total.'}
                </div>}
              </div>
              <div className="form-group">
                <label className="form-label">{t.baseAmount||'Base Amount (Before Tax)'}</label>
                <div style={{display:'flex',gap:8,alignItems:'center'}}>
                  <div style={{position:'relative',flex:1}}>
                    <input className="form-input" type="number" min="0" step="1"
                      value={baseAmount} onChange={e=>{setBaseAmount(e.target.value);setLinkOrderId('');}}
                      placeholder="0.00"
                      style={{fontFamily:'Rajdhani',fontWeight:700,fontSize:18}}/>
                  </div>
                  <select className="form-select" style={{width:90}} value={baseCur} onChange={e=>setBaseCur(e.target.value)}>
                    <option>EGP</option><option>USD</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </div>

        {/* ── RIGHT COLUMN: Results ── */}
        <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--r2)',overflow:'hidden',boxShadow:'0 1px 6px rgba(0,48,135,.06)'}}>
          <div style={{background:'var(--bg3)',padding:'12px 18px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:8}}>
            <Icon name="calc" size={15}/>
            <span style={{fontWeight:700,fontSize:11,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.5px'}}>{t.calcResults||'Results'}</span>
            {base>0&&<span style={{marginLeft:'auto',fontSize:11,color:'var(--text3)'}}>{baseCur}</span>}
          </div>
          <div style={{padding:'0 20px 20px'}}>

            {/* Step-by-step calculation */}
            {[
              {label:t.baseAmount||'Base Amount',        val:base,           color:'var(--text)',    sign:'',  border:'var(--border)',  bg:'transparent', size:18},
              {label:`+ VAT (${rates.vat||0}%)`,         val:vatAmt,         color:'var(--sky)',     sign:'+', border:'var(--border)',  bg:'transparent', size:15},
              {label:`− Withholding (${rates.withholding||0}%)`, val:withholdingAmt, color:'var(--yellow)', sign:'−', border:'var(--border)', bg:'transparent', size:15},
              {label:`− Income Tax (${rates.income||0}%)`,val:incomeAmt,     color:'var(--red)',     sign:'−', border:'var(--border)',  bg:'transparent', size:15},
            ].map((row,i)=>(
              <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'13px 0',borderBottom:`1px solid ${row.border}`}}>
                <span style={{fontWeight:i===0?700:500,fontSize:13,color:i===0?'var(--text)':'var(--text2)'}}>{row.label}</span>
                <span style={{fontFamily:'Rajdhani',fontWeight:700,fontSize:row.size,color:row.color}}>
                  {i>0&&row.sign} {fmtC(row.val)}
                </span>
              </div>
            ))}

            {/* Net Receivable highlight */}
            <div style={{margin:'0 -20px',padding:'16px 20px',background:'var(--green-bg)',borderTop:'2px solid var(--border2)',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div>
                <div style={{fontWeight:700,fontSize:14,color:'var(--green)'}}>{t.netReceivable||'Net Receivable'}</div>
                <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>المبلغ الفعلي المُستلم بعد كل الخصومات</div>
