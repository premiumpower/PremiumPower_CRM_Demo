<!DOCTYPE html>
<html lang="en" dir="ltr" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PremiumPower CRM — Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#F0F4FA;--bg2:#FFFFFF;--bg3:#EEF2F8;--bg4:#E4ECF6;
      --border:#D5E0EF;--border2:#B8CCE4;
      --primary:#003087;--primary-d:#002270;
      --gold:#0070BA;--gold-d:#005fa3;
      --sky:#009CDE;--sky-d:#007BB5;
      --text:#0D1E38;--text2:#4D6A8A;--text3:#8FAABF;
      --green:#0A8F5C;--green-bg:rgba(10,143,92,.1);
      --red:#D13438;--red-bg:rgba(209,52,56,.09);
      --blue:#009CDE;--blue-bg:rgba(0,156,222,.1);
      --yellow:#0070BA;--yellow-bg:rgba(0,112,186,.1);
      --primary-bg:rgba(0,48,135,.07);
      --purple:#5B3FC1;--purple-bg:rgba(91,63,193,.1);
      --sidebar-w:258px;--topbar-h:64px;--r:8px;--r2:12px;
      --shadow:0 4px 24px rgba(0,48,135,.1);
    }
    html,body{height:100%;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55}
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:var(--bg3)}
    ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
    .app-layout{display:flex;height:100vh;overflow:hidden}

    /* ── SIDEBAR ── */
    .sidebar{width:var(--sidebar-w);background:var(--primary);border-right:none;display:flex;flex-direction:column;height:100vh;position:relative;flex-shrink:0;overflow:hidden;transition:width .2s}
    [dir=rtl] .sidebar{border-right:none;border-left:none}
    .sidebar::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--sky),#0070BA)}
    .sidebar-logo{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
    .logo-mark{display:flex;align-items:center;gap:10px}
    .logo-icon{width:38px;height:38px;background:linear-gradient(135deg,#009CDE,#0070BA);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:17px;color:var(--primary);flex-shrink:0;letter-spacing:-0.5px}
    .logo-text .main{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:#fff;line-height:1.1;letter-spacing:.3px}
    .logo-text .sub{font-size:9px;color:#009CDE;letter-spacing:1.8px;text-transform:uppercase;font-weight:600}
    .sidebar-nav{flex:1;overflow-y:auto;padding:12px 0}
    .nav-section{padding:0 10px 6px}
    .nav-section-label{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.35);padding:8px 8px 3px;font-weight:700}
    .nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--r);cursor:pointer;color:rgba(255,255,255,.65);transition:all .13s;margin-bottom:1px;font-size:13.5px;font-weight:500;user-select:none}
    .nav-item:hover{background:rgba(255,255,255,.1);color:#fff}
    .nav-item.active{background:#009CDE;color:#fff}
    .nav-icon{width:17px;height:17px;flex-shrink:0}
    .nav-badge{margin-left:auto;background:var(--sky);color:#fff;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}
    [dir=rtl] .nav-badge{margin-left:0;margin-right:auto}
    .sidebar-footer{padding:10px;border-top:1px solid rgba(255,255,255,.12)}
    .user-card{display:flex;align-items:center;gap:9px;padding:9px;border-radius:var(--r);background:rgba(255,255,255,.1)}
    .user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#009CDE,#0070BA);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--primary);flex-shrink:0}
    .user-info{flex:1;min-width:0}
    .user-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .user-role{font-size:11px;color:#009CDE;font-weight:500}
    .logout-btn{padding:6px;background:none;border:none;color:rgba(255,255,255,.45);cursor:pointer;border-radius:6px;display:flex;align-items:center}
    .logout-btn:hover{background:rgba(209,52,56,.25);color:#fff}

    /* ── MAIN ── */
    .main-content{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
    .topbar{height:var(--topbar-h);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:14px;flex-shrink:0;box-shadow:0 1px 4px rgba(0,48,135,.06)}
    .topbar-title{font-family:'Rajdhani',sans-serif;font-size:19px;font-weight:700;color:var(--text);flex:1}
    .topbar-title span{color:var(--primary)}
    .tab-content{flex:1;overflow-y:auto;padding:22px}

    /* ── BUTTONS ── */
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r);border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:13px;font-weight:600;transition:all .13s;white-space:nowrap;user-select:none;line-height:1}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{background:var(--primary-d)}
    .btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
    .btn-secondary:hover{background:var(--bg4)}
    .btn-danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(209,52,56,.2)}
    .btn-danger:hover{background:var(--red);color:#fff}
    .btn-success{background:var(--green-bg);color:var(--green);border:1px solid rgba(10,143,92,.2)}
    .btn-success:hover{background:var(--green);color:#fff}
    .btn-ghost{background:transparent;color:var(--text2);padding:6px 8px}
    .btn-ghost:hover{background:var(--bg3);color:var(--text)}
    .btn-sm{padding:5px 10px;font-size:12px}
    .btn-icon{padding:7px}
    .btn:disabled{opacity:.4;cursor:not-allowed}

    /* ── TOPBAR DATA TOOLS ── */
    .topbar-data-tools{display:flex;gap:5px;align-items:center}
    .topbar-tool-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-family:'Cairo',sans-serif;font-size:11.5px;font-weight:600;cursor:pointer;transition:all .13s;white-space:nowrap}
    .topbar-tool-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
    .topbar-tool-btn-reset:hover{background:var(--red);color:#fff;border-color:var(--red)}
    @media(max-width:640px){.topbar-tool-btn span{display:none}.topbar-tool-btn{padding:6px}}

    /* ── LANG TOGGLE ── */
    .lang-toggle{display:flex;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
    .lang-btn{padding:6px 11px;cursor:pointer;font-size:12px;font-weight:700;color:var(--text2);transition:all .13s;border:none;background:transparent;font-family:'Cairo',sans-serif;letter-spacing:.3px}
    .lang-btn.active{background:var(--primary);color:#fff}

    /* ── SECTION ── */
    .section-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
    .section-title{font-family:'Rajdhani',sans-serif;font-size:21px;font-weight:700;color:var(--text)}
    .section-subtitle{font-size:12px;color:var(--text2);margin-top:2px}
    .toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
    .search-box{position:relative;display:flex;align-items:center}
    .search-icon{position:absolute;left:10px;color:var(--text3);pointer-events:none}
    [dir=rtl] .search-icon{left:auto;right:10px}
    .search-input{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:8px 12px 8px 32px;color:var(--text);font-family:'Cairo',sans-serif;font-size:13px;width:230px;outline:none;transition:border-color .13s;box-shadow:inset 0 1px 3px rgba(0,48,135,.04)}
    [dir=rtl] .search-input{padding:8px 32px 8px 12px}
    .search-input:focus{border-color:var(--sky)}
    .search-input::placeholder{color:var(--text3)}
    .filter-select{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:8px 11px;color:var(--text);font-family:'Cairo',sans-serif;font-size:13px;outline:none;cursor:pointer;box-shadow:inset 0 1px 3px rgba(0,48,135,.04)}
    .filter-select:focus{border-color:var(--sky)}
    .filter-select option{background:var(--bg2)}

    /* ── TABLE ── */
    .table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;box-shadow:0 1px 6px rgba(0,48,135,.06)}
    .table{width:100%;border-collapse:collapse}
    .table th{background:var(--primary);padding:11px 15px;text-align:left;font-size:10px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:.8px;text-transform:uppercase;border-bottom:none;white-space:nowrap}
    .user-av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--sky));color:#fff;font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:6px;vertical-align:middle}
    .cell-code-pill{font-size:9.5px;font-weight:700;color:var(--text3);background:var(--bg3);padding:1px 6px;border-radius:4px;letter-spacing:.5px;display:inline-block;margin-bottom:3px}
    [dir=rtl] .table th{text-align:right;color:rgba(255,255,255,.85)}
    .table td{padding:11px 15px;border-bottom:1px solid var(--border);color:var(--text);font-size:13.5px;vertical-align:middle}
    .table tr:last-child td{border-bottom:none}
    .table tbody tr:hover td{background:rgba(0,156,222,.04)}
    .table-actions{display:flex;gap:3px;align-items:center}
    .cell-code{font-family:'Rajdhani',sans-serif;font-size:12.5px;font-weight:600;color:var(--text2);letter-spacing:.5px}
    .cell-main{font-weight:600;color:var(--text)}
    .cell-sub{font-size:12px;color:var(--text2);margin-top:1px}

    /* ── BADGES ── */
    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.2px}
    .badge::before{content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0}
    .badge-green{background:rgba(10,143,92,.1);color:#0a6640;border:1px solid rgba(10,143,92,.25)}.badge-green::before{background:#0a8f5c}
    .badge-red{background:var(--red-bg);color:#a02020;border:1px solid rgba(209,52,56,.25)}.badge-red::before{background:var(--red)}
    .badge-blue{background:var(--blue-bg);color:#0a5fa0;border:1px solid rgba(0,156,222,.25)}.badge-blue::before{background:var(--sky)}
    .badge-yellow{background:rgba(0,112,186,.1);color:#0057a0;border:1px solid rgba(0,112,186,.25)}.badge-yellow::before{background:#0070BA}
    .badge-orange{background:rgba(0,112,186,.12);color:#0057a0;border:1px solid rgba(0,112,186,.25)}.badge-orange::before{background:#0070BA}
    .badge-gray{background:rgba(77,106,138,.08);color:var(--text2);border:1px solid var(--border)}.badge-gray::before{background:var(--text3)}
    .badge-purple{background:var(--purple-bg);color:var(--purple);border:1px solid rgba(91,63,193,.25)}.badge-purple::before{background:var(--purple)}

    /* ── STATS ── */
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
    .stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:18px;position:relative;overflow:hidden;box-shadow:0 1px 6px rgba(0,48,135,.06)}
    .stat-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--accent,var(--primary))}
    .stat-label{font-size:11px;color:var(--text2);font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
    .stat-value{font-family:'Rajdhani',sans-serif;font-size:26px;font-weight:700;color:var(--text)}
    .stat-sub{font-size:12px;color:var(--text2);margin-top:3px}

    /* ── MODAL ── */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,20,60,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(6px)}
    .modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:620px;max-height:90vh;overflow-y:auto;overflow-x:visible;box-shadow:0 16px 48px rgba(0,48,135,.18);animation:modalIn .18s ease}
    @keyframes modalIn{from{opacity:0;transform:translateY(-12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
    .modal-lg{max-width:820px}
    .modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--border);background:var(--bg3);border-radius:14px 14px 0 0}
    .modal-header-left{display:flex;align-items:center;gap:11px}
    .modal-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--primary),var(--sky));border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0}
    .modal-title-wrap .modal-title{font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;color:var(--text);letter-spacing:.2px}
    .modal-title-wrap .modal-subtitle{font-size:11px;color:var(--text3);margin-top:1px}
    .modal-title{font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;color:var(--text);letter-spacing:.2px}
    .modal-close-btn{background:none;border:1px solid var(--border);border-radius:7px;width:30px;height:30px;cursor:pointer;color:var(--text2);font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0}
    .modal-close-btn:hover{background:var(--bg4);border-color:var(--border2);color:var(--text)}
    .modal-body{padding:22px}
    .modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--border);background:var(--bg3);border-radius:0 0 14px 14px}
    [dir=rtl] .modal-footer{flex-direction:row-reverse}

    /* ── FORM ── */
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .form-grid.cols-1{grid-template-columns:1fr}
    .form-grid.cols-3{grid-template-columns:1fr 1fr 1fr}
    .form-group{display:flex;flex-direction:column;gap:5px}
    .form-group.span-2{grid-column:span 2}
    .form-group.span-3{grid-column:span 3}
    .form-label{font-size:11.5px;font-weight:700;color:var(--text2);letter-spacing:.2px;text-transform:uppercase}
    .form-input,.form-select,.form-textarea{background:var(--bg2);border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'Cairo',sans-serif;font-size:13.5px;outline:none;transition:border-color .15s,box-shadow .15s;width:100%;box-shadow:inset 0 1px 3px rgba(0,48,135,.04)}
    .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(0,156,222,.15)}
    .form-input:hover:not(:focus),.form-select:hover:not(:focus),.form-textarea:hover:not(:focus){border-color:var(--border2)}
    .form-input::placeholder,.form-textarea::placeholder{color:var(--text3)}
    .form-textarea{resize:vertical;min-height:80px}
    .form-select option{background:var(--bg2)}
    .form-section-title{font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.5px;padding:10px 0 4px;border-bottom:1px solid var(--border);margin-bottom:2px;grid-column:1/-1}

    /* ── LINE ITEMS ── */
    .line-items-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:visible;margin-top:6px}
    .li-table{width:100%;border-collapse:collapse;font-size:13px}
    .li-table th{background:var(--bg3);padding:8px 10px;text-align:left;color:var(--text2);font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border-bottom:1px solid var(--border)}
    [dir=rtl] .li-table th{text-align:right}
    .li-table td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
    .li-table tr:last-child td{border-bottom:none}
    .li-total{background:var(--bg4);border-top:2px solid var(--border2)}
    .li-total td{font-weight:700;color:var(--primary);padding:10px 10px;font-size:14px}
    .li-input{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:5px 8px;color:var(--text);font-family:'Cairo',sans-serif;font-size:13px;width:100%;outline:none}
    .li-input:focus{border-color:var(--sky);box-shadow:0 0 0 2px rgba(0,156,222,.1)}

    /* ── EMPTY STATE ── */
    .empty-state{text-align:center;padding:50px 20px;color:var(--text2)}
    .empty-icon{width:50px;height:50px;background:var(--bg3);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--text3)}
    .empty-title{font-size:15px;font-weight:600;color:var(--text2);margin-bottom:5px}
    .empty-sub{font-size:12.5px;color:var(--text3)}

    /* ── LOGIN ── */
    .login-page{display:flex;height:100vh;align-items:center;justify-content:center;background:var(--primary);position:relative;overflow:hidden}
    .login-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 75% 25%,rgba(0,156,222,.35) 0%,transparent 55%),radial-gradient(ellipse at 20% 80%,rgba(0,112,186,.15) 0%,transparent 50%)}
    .login-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:40px 40px}
    .login-card{background:#fff;border:1px solid var(--border2);border-radius:16px;padding:38px;width:100%;max-width:390px;position:relative;z-index:1;box-shadow:0 24px 64px rgba(0,0,0,.3)}
    .login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--primary),#009CDE,#0070BA);border-radius:16px 16px 0 0}
    .login-logo{display:flex;flex-direction:column;align-items:center;margin-bottom:28px}
    .login-logo-icon{width:58px;height:58px;background:linear-gradient(135deg,var(--primary),var(--sky));border-radius:15px;display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;color:#fff;margin-bottom:11px;box-shadow:0 8px 24px rgba(0,48,135,.3)}
    .login-logo-name{font-family:'Rajdhani',sans-serif;font-size:21px;font-weight:700;color:var(--primary);letter-spacing:.3px}
    .login-logo-sub{font-size:11px;color:var(--sky);letter-spacing:1.8px;text-transform:uppercase;margin-top:1px;font-weight:600}
    .login-title{font-size:13px;color:var(--text2);text-align:center;margin-bottom:24px}
    .login-form{display:flex;flex-direction:column;gap:13px}
    .login-submit{width:100%;padding:12px;font-size:14.5px;margin-top:4px;justify-content:center;background:linear-gradient(135deg,var(--primary),var(--sky))}
    .login-submit:hover{background:linear-gradient(135deg,var(--primary-d),var(--sky-d))}
    .login-error{background:var(--red-bg);border:1px solid rgba(209,52,56,.2);border-radius:var(--r);padding:9px 13px;color:var(--red);font-size:13px;text-align:center}

    /* ── CONFIRM ── */
    .confirm-dialog{background:var(--bg2);border-radius:16px;overflow:hidden;max-width:360px;width:100%;text-align:center;box-shadow:0 16px 48px rgba(0,48,135,.2);animation:modalIn .18s ease}
    .confirm-dialog-body{padding:28px 26px 20px}
    .confirm-icon{width:52px;height:52px;background:#fff0f0;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;border:2px solid #ffd5d5}
    .confirm-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:7px}
    .confirm-msg{font-size:13px;color:var(--text2);margin-bottom:0;line-height:1.6}
    .confirm-footer{padding:14px 22px;border-top:1px solid var(--border);background:var(--bg3);display:flex;gap:10px;justify-content:center}
    .confirm-actions{display:flex;gap:9px;justify-content:center}

    /* ── TOAST ── */
    .toast{position:fixed;bottom:22px;right:22px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);padding:13px 16px;display:flex;align-items:center;gap:9px;z-index:9999;box-shadow:0 6px 24px rgba(0,48,135,.15);animation:toastIn .25s ease;font-size:13px;font-weight:600;max-width:300px;color:var(--text)}
    [dir=rtl] .toast{right:auto;left:22px}

const fmt = (n, currency='EGP') => {
  const num = Number(n)||0;
  if(currency==='USD') return `$ ${num.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
  return `${num.toLocaleString('en')} EGP`;
};

const calcOffer = (items, discount, tax) => {
  const sub = items.reduce((s,i)=>s+(i.qty||0)*(i.unitPrice||0),0);
  const disc = sub*(discount||0)/100;
  const afterDisc = sub-disc;
  const taxAmt = afterDisc*(tax||0)/100;
  return { sub, disc, afterDisc, taxAmt, grand: afterDisc+taxAmt };
};

const _genId = (arr) => arr.length ? Math.max(...arr.map(x=>x.id))+1 : 1;
const _demoMockApi = (method, path, body) => {
  const d = _demoData;
  const seg = path.replace(/\/$/,'').split('/').filter(Boolean);
  const entity = seg[0];
  const id = seg[1] ? Number(seg[1]) : null;
  const entityMap = {
    customers:'customers', contacts:'contacts', products:'products',
    offers:'offers', orders:'orders', users:'users',
    costsheets:'costSheets', taxsettings:'taxSettings',
  };
  const key = entityMap[entity];

  if(entity==='auth' && seg[1]==='me') return {id:1,name:'Ahmed Hassan',email:'admin@premiumpower-eg.com',role:'Admin',active:true};
  if(entity==='auth') return {token:'demo-token',user:{id:1,name:'Ahmed Hassan',email:'admin@premiumpower-eg.com',role:'Admin',active:true}};
  if(entity==='taxsettings') return method==='GET' ? d.taxSettings : (d.taxSettings={...d.taxSettings,...body}, d.taxSettings);

  if(!key || !(key in d)) return {};
  if(method==='GET') return Array.isArray(d[key]) ? [...d[key]] : d[key];
  if(method==='POST'){
    const newRec = {...body, id:_genId(d[key])};
    d[key] = [...d[key], newRec];
    return newRec;
  }
  if(method==='PUT'){
    d[key] = d[key].map(r=>r.id===id?{...r,...body,id}:r);
    return d[key].find(r=>r.id===id);
  }
  if(method==='DELETE'){
    d[key] = d[key].filter(r=>r.id!==id);
    return {ok:true};
  }
  return {};
};

// ── Excel import/export (SheetJS via CDN) ───────
const loadSheetJS = () => new Promise((res, rej) => {
  if (window.XLSX) { res(window.XLSX); return; }
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload = () => res(window.XLSX);
  s.onerror = () => rej(new Error('Failed to load SheetJS'));
  document.head.appendChild(s);
});

const exportToExcel = async (rows, sheetName, fileName) => {
  const XLSX = await loadSheetJS();
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, fileName);
};

const readExcelFile = (file) => new Promise(async (res, rej) => {
  const XLSX = await loadSheetJS();
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'binary', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      res(XLSX.utils.sheet_to_json(ws, { defval: '' }));
    } catch(err) { rej(err); }
  };
  reader.onerror = rej;
  reader.readAsBinaryString(file);
});

const _escStack = [];
const Modal = ({ open, title, onClose, children, footer, large }) => {
  useEffect(()=>{
    if(!open) return;
    _escStack.push(onClose);
    const handler = (e) => {
      if(e.key==='Escape' && _escStack.length>0) {
        const fn = _escStack[_escStack.length-1];
        fn();
      }
    };
    document.addEventListener('keydown', handler);
    return ()=>{
      document.removeEventListener('keydown', handler);
      const idx = _escStack.lastIndexOf(onClose);
      if(idx>-1) _escStack.splice(idx,1);
    };
  }, [open, onClose]);
  if(!open) return null;
  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className={`modal${large?' modal-lg':''}`}>
        <div className="modal-header">
          <span className="modal-title">{title}</span>
          <button className="modal-close-btn" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-footer">{footer}</div>}
      </div>
    </div>
  );
};

const PAGE_SIZE_OPTIONS = [25, 50, 100, 200];
const Pagination = ({ total, page, pageSize, onPage, onPageSize }) => {
  const totalPages = Math.ceil(total/pageSize);
  if(total<=25) return null;
  const pages = [];
  for(let i=1;i<=totalPages;i++){
    if(i===1||i===totalPages||Math.abs(i-page)<=1) pages.push(i);
    else if(pages[pages.length-1]!=='...') pages.push('...');
  }
  return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 16px',background:'var(--bg3)',borderTop:'1px solid var(--border)',flexWrap:'wrap',gap:8}}>

          value={pageSize} onChange={e=>{ onPageSize(Number(e.target.value)); onPage(1); }}>
          {PAGE_SIZE_OPTIONS.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <span>من أصل <strong>{total}</strong></span>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:3}}>
        <button style={{padding:'4px 8px',border:'1px solid var(--border)',borderRadius:4,background:page===1?'var(--bg3)':'var(--bg2)',cursor:page===1?'not-allowed':'pointer',color:page===1?'var(--text3)':'var(--text)',fontSize:12}} onClick={()=>onPage(page-1)} disabled={page===1}>‹</button>
        {pages.map((pg,i)=>
          pg==='...'
            ? <span key={i} style={{padding:'4px 6px',fontSize:12,color:'var(--text3)'}}>…</span>
            : <button key={pg} onClick={()=>onPage(pg)} style={{padding:'4px 9px',border:'1px solid var(--border)',borderRadius:4,fontSize:12,cursor:'pointer',background:page===pg?'var(--primary)':'var(--bg2)',color:page===pg?'#fff':'var(--text)',fontWeight:page===pg?700:400}}>{pg}</button>

      </div>
    </div>
  );
};

                <button key={i} className="quick-btn" onClick={()=>setActiveTab(q.tab)}>
                  <div className={`quick-btn-icon ${q.color}`}><Icon name={q.icon} size={16}/></div>
                  {q.label}
                </button>
              ))}
            </div>
          </div>
        </div>
      </div>


    </div>
  );
}

// ════════════════════════════════════════════════
//  CUSTOMERS TAB
// ════════════════════════════════════════════════
function CustomersTab({ data, setData, user, t, showToast, handleApiError, setActiveTab }) {
  const [search, setSearch] = useState('');
  const [filterStatus, setFilterStatus] = useState('');
  const [sortBy, setSortBy] = useState('name');
  const [sortDir, setSortDir] = useState('asc');
  const [selected, setSelected] = useState([]);
  const [bulkDeleteConfirm, setBulkDeleteConfirm] = useState(false);
  const [modal, setModal] = useState(null);
  const [deleteTarget, setDeleteTarget] = useState(null);
  const [contactsPanel, setContactsPanel] = useState(null);
  const [page, setPage] = useState(1);
  const [pageSize, setPageSize] = useState(50);
  const [activePanel, setActivePanel] = useState('contacts');
  const [viewingOffer, setViewingOffer] = useState(null);
  const [viewingOrder, setViewingOrder] = useState(null);
  const isAdmin = user.role==='Admin', isManager = user.role==='Manager'||isAdmin;

  const industries = ['Energy','Manufacturing','Construction','Telecom','Government','Healthcare','Other'];
  const statuses = ['Active','Inactive','Lead','Prospect'];

  const filtered = data.customers.filter(c=>{
    const byRole = isManager || c.assignedTo===user.id;
    const bySearch = !search || c.name.toLowerCase().includes(search.toLowerCase()) || c.code.includes(search);
    const bySt = !filterStatus || c.status===filterStatus;
    return byRole && bySearch && bySt;
  }).sort((a,b)=>{
    let va=a[sortBy]||'', vb=b[sortBy]||'';
    if(typeof va==='string') va=va.toLowerCase();
    if(typeof vb==='string') vb=vb.toLowerCase();
    if(va<vb) return sortDir==='asc'?-1:1;
    if(va>vb) return sortDir==='asc'?1:-1;
    return 0;
  });

  const allSelected = filtered.length>0 && filtered.every(c=>selected.includes(c.id));
  const toggleSelectAll = () => setSelected(allSelected?[]:[...filtered.map(c=>c.id)]);
  const toggleOne = (id) => setSelected(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  const bulkDelete = async () => {
    try {
      for(const id of selected) await apiFetch('DELETE',`/customers/${id}`);
      setData(d=>({...d,customers:d.customers.filter(c=>!selected.includes(c.id))}));
      setSelected([]); setBulkDeleteConfirm(false);
      showToast(`Deleted ${selected.length} customers`,'success');
    } catch(e){ handleApiError(e); }
  };

  const blankForm = { code:'', name:'', industry:'Energy', phone:'', email:'', address:'', website:'', status:'Active', assignedTo:user.id, notes:'' };
  const [form, setForm] = useState(blankForm);
  const [formErr, setFormErr] = useState({});
  const [nameSuggestions, setNameSuggestions] = useState([]);
  const [nameWarning, setNameWarning] = useState('');

  const handleNameChange = (val) => {
    setForm(f=>({...f,name:val}));
    setNameWarning('');
    if(val.trim().length<2){setNameSuggestions([]);return;}
    const lower=val.trim().toLowerCase();
    const matches=data.customers.filter(c=>c.name.toLowerCase().includes(lower)&&(modal==='add'||c.id!==form.id));
    const exact=matches.find(c=>c.name.trim().toLowerCase()===lower);
    if(exact){setNameWarning('⚠️ العميل ده موجود أصلاً!');setNameSuggestions([]);}
    else{setNameSuggestions(matches.slice(0,4));setNameWarning('');}
  };
  const selectSuggestion = (c) => {
    setForm(f=>({...f,name:c.name}));
    setNameSuggestions([]);
    setNameWarning('⚠️ الاسم ده موجود — هل تقصد عميل تاني؟');
  };

  const open = (mode, rec) => {
    setForm(rec ? {...rec} : {...blankForm, code:`C${String(nextId(data.customers)).padStart(4,'0')}`});
    setFormErr({});
    setNameSuggestions([]);
    setNameWarning('');
    setModal(mode);
  };
  const save = async () => {
    const errs = {};
    if(!form.name) errs.name = t.required||'Required';
    if(form.email && !isValidEmail(form.email)) errs.email = 'Invalid email format';
    if(form.phone && !isValidPhone(form.phone)) errs.phone = 'Invalid phone format';
    if(Object.keys(errs).length){ setFormErr(errs); return; }
    const isDuplicate = data.customers.some(c =>
      c.name.trim().toLowerCase() === form.name.trim().toLowerCase() &&
      (modal==='add' || c.id !== form.id)
    );
    if(isDuplicate){ showToast('⚠️ ' + (t.duplicateCompany||'Company name already exists'), 'error'); return; }
    try {
      if(modal==='add') {
        const created = await apiFetch('POST', '/customers', {...form, createdAt:today()});
        setData(d=>({...d, customers:[...d.customers, created]}));
      } else {
        const updated = await apiFetch('PUT', `/customers/${form.id}`, form);
        setData(d=>({...d, customers:d.customers.map(c=>c.id===form.id?(updated||form):c)}));
      }
      setModal(null); setFormErr({}); showToast(t.saved);
    } catch(e) { handleApiError(e); }
  };
  const del = async () => {
    try {
      await apiFetch('DELETE', `/customers/${deleteTarget}`);
      setData(d=>({...d, customers:d.customers.filter(c=>c.id!==deleteTarget)}));
      setDeleteTarget(null); showToast(t.deleted,'success');
    } catch(e) { handleApiError(e); }
  };

  const importRef = useRef();
  const handleExport = async () => {
    const rows = filtered.map(c=>({
      Code:c.code, Name:c.name, Industry:c.industry||'', Phone:c.phone||'',
      Email:c.email||'', Address:c.address||'', Website:c.website||'',
      Status:c.status, Notes:c.notes||'', CreatedAt:c.createdAt
    }));
    exportToExcel(rows, 'Customers', 'customers.xlsx').catch(()=>showToast('Export failed','error'));
  };
  const handleImport = async (e) => {
    const file = e.target.files[0]; if(!file) return;
    try {
      const rows = await readExcelFile(file);
      const newCustomers = [];
      for (const r of rows) {
        try {
          const rec = {
            code: r.Code || r.code || '',
            name: r.Name || r.name || '(Unknown)',
            industry: r.Industry || r.industry || 'Other',
            phone: r.Phone || r.phone || '',
            email: r.Email || r.email || '',
            address: r.Address || r.address || '',
            website: r.Website || r.website || '',
            status: r.Status || r.status || 'Active',
            assignedTo: user.id,
            notes: r.Notes || r.notes || '',
            createdAt: today(),
          };
          const created = await apiFetch('POST', '/customers', rec);
          newCustomers.push(created);
        } catch {}
      }
      setData(d=>({...d, customers:[...d.customers, ...newCustomers]}));
      showToast(`Imported ${newCustomers.length} customers`);
    } catch { showToast('Import failed — check file format','error'); }
    e.target.value='';
  };

  return (
    <div className="tab-content">
      <div className="section-header">
        <div>
          <div className="section-title">{t.customers}</div>
          <div className="section-subtitle">{filtered.length} {t.totalCustomers}</div>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-excel btn-sm" onClick={handleExport}><Icon name="xls" size={14}/> Export</button>
          <button className="btn btn-excel btn-sm" onClick={()=>importRef.current.click()}><Icon name="upload" size={14}/> Import</button>
          <input ref={importRef} type="file" accept=".xlsx,.xls,.csv" className="import-file-input" onChange={handleImport}/>
          <button className="btn btn-primary" onClick={()=>open('add')}><Icon name="plus" size={15}/> {t.addCustomer}</button>
        </div>
      </div>
      <div className="toolbar">
        <div className="search-box">
          <span className="search-icon"><Icon name="search" size={15}/></span>
          <input className="search-input" placeholder={t.search} value={search} onChange={e=>{setSearch(e.target.value);setPage(1);}}/>
        </div>
        <select className="filter-select" value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
          <option value="">{t.filterStatus}</option>
          {statuses.map(s=>{
            const keyMap={Active:'active2',Inactive:'inactive',Lead:'lead',Prospect:'prospect'};
            return <option key={s} value={s}>{t[keyMap[s]]||s}</option>;
          })}
        </select>
        <select className="filter-select" value={sortBy+'_'+sortDir} onChange={e=>{const[col,dir]=e.target.value.split('_');setSortBy(col);setSortDir(dir);}}>
          <option value="name_asc">الاسم A→Z</option>
          <option value="name_desc">الاسم Z→A</option>
          <option value="status_asc">الحالة A→Z</option>
          <option value="createdAt_desc">الأحدث أولاً</option>
          <option value="createdAt_asc">الأقدم أولاً</option>
          <option value="industry_asc">القطاع A→Z</option>
        </select>
        {selected.length>0 && isManager && (
          <button className="btn btn-danger btn-sm" onClick={()=>setBulkDeleteConfirm(true)}>
            🗑️ حذف {selected.length} محدد
          </button>
        )}
      </div>
      <div className="table-wrap">
        <table className="table">
          <thead><tr>
            <th style={{width:36}}><input type="checkbox" checked={allSelected} onChange={toggleSelectAll} style={{cursor:'pointer',width:15,height:15}}/></th>
            <th>{t.companyName}</th>
            <th>{t.notes}</th>
            <th>{t.phone}</th>
            <th>{t.address}</th>
            <th>{t.assignedTo}</th>
            <th>{t.actions}</th>
          </tr></thead>
          <tbody>
            {filtered.length===0 ? <tr><td colSpan="7"><EmptyState t={t}/></td></tr>
            : filtered.slice((page-1)*pageSize, page*pageSize).map(c=>{
              const rep = data.users.find(u=>u.id===c.assignedTo);
              const isChecked = selected.includes(c.id);
              return (
                <tr key={c.id} style={{background:isChecked?'var(--primary-bg)':''}}>
                  <td><input type="checkbox" checked={isChecked} onChange={()=>toggleOne(c.id)} style={{cursor:'pointer',width:15,height:15}}/></td>
                  <td>
                    <div style={{display:'flex',alignItems:'center',gap:6}}>
                      <span className="cell-code-pill">{c.code}</span>
                      <button className="cell-link" onClick={()=>{setContactsPanel(c);setActivePanel('contacts');}}>{c.name}</button>
                    </div>

                  </td>
                  <td style={{fontSize:12,color:'var(--text2)',maxWidth:160}}>
                    {c.notes
                      ? <span title={c.notes} style={{display:'block',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:150}}>{c.notes}</span>
                      : <span style={{color:'var(--text3)'}}>—</span>}
                  </td>
                  <td style={{fontSize:13}}>{c.phone||<span style={{color:'var(--text3)'}}>—</span>}</td>
                  <td style={{fontSize:12,color:'var(--text2)'}}>{c.address||<span style={{color:'var(--text3)'}}>—</span>}</td>
                  <td>
                    {rep ? <span><span className="user-av">{rep.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}</span><span style={{fontSize:12,color:'var(--text2)'}}>{rep.name}</span></span> : <span style={{color:'var(--text3)',fontSize:12}}>—</span>}
                  </td>
                  <td><div className="table-actions">
                    <button className="btn btn-ghost btn-sm btn-icon" onClick={()=>open('edit',c)} title={t.edit}><Icon name="edit" size={14}/></button>
                    {isManager && <button className="btn btn-ghost btn-sm btn-icon" style={{color:'var(--red)'}} onClick={()=>setDeleteTarget(c.id)} title={t.delete}><Icon name="trash" size={14}/></button>}
                  </div></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <Pagination total={filtered.length} page={page} pageSize={pageSize} onPage={(p)=>setPage(p)} onPageSize={(s)=>{setPageSize(s);setPage(1);}}/>

      <Modal open={!!modal} title={modal==='add'?t.addCustomer:t.editCustomer} onClose={()=>setModal(null)}
        footer={<><button className="btn btn-secondary" onClick={()=>setModal(null)}>{t.cancel}</button><button className="btn btn-primary" onClick={save}>{t.save}</button></>}>
        <div className="form-grid">
          <FG label={t.companyName} span={2}>
            <div style={{position:'relative'}}>
              <input className="form-input" value={form.name||''} autoComplete="off"
                onChange={e=>handleNameChange(e.target.value)} placeholder="Company Name"/>
              {nameWarning && (
                <div style={{marginTop:4,padding:'6px 10px',background:'#FFEBEE',border:'1px solid #FFCDD2',borderRadius:6,fontSize:12,color:'var(--red)',fontWeight:600}}>
                  {nameWarning}
                </div>
              )}
              {nameSuggestions.length>0 && (
                <div style={{position:'absolute',top:'100%',left:0,right:0,background:'#fff',border:'1px solid var(--border)',borderRadius:8,boxShadow:'0 4px 16px rgba(0,48,135,.12)',zIndex:999,maxHeight:180,overflowY:'auto'}}>
                  <div style={{padding:'5px 12px',fontSize:11,color:'var(--text3)',background:'var(--bg3)',borderBottom:'1px solid var(--border)'}}>
                    عملاء مشابهين:
                  </div>
                  {nameSuggestions.map(c=>(
                    <div key={c.id}
                      onMouseDown={e=>{e.preventDefault();selectSuggestion(c);}}
                      style={{padding:'8px 12px',cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:13,borderBottom:'1px solid var(--bg3)'}}
                      onMouseEnter={e=>e.currentTarget.style.background='var(--bg3)'}
                      onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                      <span style={{fontWeight:600,color:'var(--text)'}}>{c.name}</span>
                      <span style={{fontSize:11,color:'var(--text3)'}}>{c.code} · <Badge text={c.status} color={statusColor[c.status]||'gray'}/></span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </FG>
          <FG label={t.industry}>
            <select className="form-select" value={form.industry||'Energy'} onChange={e=>setForm({...form,industry:e.target.value})}>
              {industries.map(i=><option key={i}>{i}</option>)}
            </select>
          </FG>
          <FG label={t.status}>
            <select className="form-select" value={form.status||'Active'} onChange={e=>setForm({...form,status:e.target.value})}>
              {statuses.map(s=><option key={s}>{s}</option>)}
            </select>
          </FG>
          <FG label={t.phone} error={formErr.phone}><input className={`form-input${formErr.phone?' border-red':''}`} value={form.phone||''} onChange={e=>{setForm({...form,phone:e.target.value});setFormErr(x=>({...x,phone:''}));}} placeholder="+20 ..."/></FG>
          <FG label={t.email2} error={formErr.email}><input className={`form-input${formErr.email?' border-red':''}`} type="email" value={form.email||''} onChange={e=>{setForm({...form,email:e.target.value});setFormErr(x=>({...x,email:''}));}} placeholder="info@company.com"/></FG>
          <FG label={t.address} span={2}><input className="form-input" value={form.address||''} onChange={e=>setForm({...form,address:e.target.value})} placeholder="City, Country"/></FG>
          <FG label={t.website}><input className="form-input" value={form.website||''} onChange={e=>setForm({...form,website:e.target.value})} placeholder="website.com"/></FG>
          <FG label={t.assignedTo}>
            <select className="form-select" value={form.assignedTo||user.id} onChange={e=>setForm({...form,assignedTo:Number(e.target.value)})}>
              {data.users.filter(u=>u.role!=='Admin'||isAdmin).map(u=><option key={u.id} value={u.id}>{u.name}</option>)}
            </select>
          </FG>
          <FG label={t.notes} span={2}><textarea className="form-textarea" value={form.notes||''} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="Internal notes..."/></FG>
        </div>
      </Modal>
      <Confirm open={!!deleteTarget} t={t} title={t.deleteConfirm} message={t.deleteMsg} onConfirm={del} onCancel={()=>setDeleteTarget(null)}/>
      <Confirm open={bulkDeleteConfirm} t={t} title="حذف متعدد" message={`هتحذف ${selected.length} عميل — مش هيرجعوا. متأكد؟`} onConfirm={bulkDelete} onCancel={()=>setBulkDeleteConfirm(false)}/>

      {/* ── CONTACTS PANEL ── */}
      {contactsPanel && (()=>{
        const coContacts = data.contacts.filter(c=>c.company===contactsPanel.id);
        const coOffers   = data.offers.filter(o=>o.customerId===contactsPanel.id);
        const coOrders   = data.orders.filter(o=>o.customerId===contactsPanel.id);
        const rep = data.users.find(u=>u.id===contactsPanel.assignedTo);
        const sectionStyle = {marginBottom:16};
        const sectionHead = {display:'flex',alignItems:'center',justifyContent:'space-between',
          padding:'9px 14px',background:'var(--bg3)',border:'1px solid var(--border)',
          borderRadius:'var(--r)',marginBottom:8,fontWeight:700,fontSize:13,color:'var(--primary)'};
        return (
          <Modal open={true} title={contactsPanel.name} onClose={()=>setContactsPanel(null)}
            footer={<button className="btn btn-secondary" onClick={()=>setContactsPanel(null)}>{t.close}</button>}>
            <div className="company-panel-header">
              <div className="company-panel-icon"><Icon name="building" size={22}/></div>
              <div>
                <div className="company-panel-name">{contactsPanel.name}</div>
                <div className="company-panel-meta">
                  {contactsPanel.code} &nbsp;·&nbsp; {contactsPanel.industry} &nbsp;·&nbsp;
                  <Badge text={contactsPanel.status} color={statusColor[contactsPanel.status]||'gray'}/>
                  {rep && <span style={{marginLeft:8,color:'rgba(255,255,255,.8)'}}>👤 {rep.name}</span>}
                </div>
              </div>
            </div>

            {/* ── Contacts Section ── */}
            <div style={sectionStyle}>
              <div style={sectionHead}>
                <span>👥 جهات الاتصال</span>
                <span style={{background:'var(--primary)',color:'#fff',borderRadius:12,padding:'1px 8px',fontSize:11}}>{coContacts.length}</span>
              </div>
              {coContacts.length===0
                ? <div style={{padding:'10px 14px',fontSize:13,color:'var(--text3)'}}>{t.noContactsYet}</div>
                : coContacts.map(c=>(
                  <div key={c.id} className="contact-card" style={{cursor:'pointer',borderRadius:'var(--r)',marginBottom:6,border:'1px solid var(--border)'}}
                    onClick={()=>{setContactsPanel(null);setActiveTab&&setActiveTab('contacts');}}>
                    <div className="contact-card-avatar">{initials(`${c.firstName} ${c.lastName}`)}</div>
                    <div className="contact-card-info">
                      <div className="contact-card-name">{c.firstName} {c.lastName}</div>
                      <div className="contact-card-title">{c.title||'—'}</div>
                      <div className="contact-card-meta">
                        {c.phone && <span><Icon name="phone" size={12}/>{c.phone}</span>}
                        {c.email && <span><Icon name="mail" size={12}/>{c.email}</span>}
                        {c.mobile && c.mobile!==c.phone && <span><Icon name="phone" size={12}/>{c.mobile}</span>}
                      </div>
                    </div>
                  </div>
                ))
              }
            </div>

            {/* ── Offers Section ── */}
            <div style={sectionStyle}>
              <div style={sectionHead}>
                <span>📋 عروض الأسعار</span>
                <span style={{background:'var(--sky)',color:'#fff',borderRadius:12,padding:'1px 8px',fontSize:11}}>{coOffers.length}</span>
              </div>
              {coOffers.length===0
                ? <div style={{padding:'10px 14px',fontSize:13,color:'var(--text3)'}}>لا يوجد عروض</div>
                : coOffers.map(o=>{
                  const calc=calcOffer(o.items||[],o.discount,o.tax);
                  return (
                    <div key={o.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',
                      padding:'9px 14px',border:'1px solid var(--border)',borderRadius:'var(--r)',
                      marginBottom:6,cursor:'pointer',background:'var(--bg2)'}}
                      onMouseEnter={e=>e.currentTarget.style.background='var(--bg3)'}
                      onMouseLeave={e=>e.currentTarget.style.background='var(--bg2)'}
                      onClick={()=>{setViewingOffer(o);}}>
                      <div style={{display:'flex',alignItems:'center',gap:8}}>
                        <span className="cell-code">{o.offerNo}</span>
                        <span style={{fontSize:12,color:'var(--text2)'}}>{o.date}</span>
                      </div>
                      <div style={{display:'flex',alignItems:'center',gap:8}}>
                        <span className="price-cell">{fmt(calc.afterDisc,o.currency)}</span>
                        <Badge text={o.status} color={statusColor[o.status]||'gray'}/>
                        <span style={{color:'var(--text3)',fontSize:11}}>›</span>
                      </div>
                    </div>
                  );
                })
              }
            </div>

            {/* ── Orders Section ── */}
            <div style={sectionStyle}>
              <div style={sectionHead}>
                <span>🛒 الطلبات</span>
                <span style={{background:'var(--green)',color:'#fff',borderRadius:12,padding:'1px 8px',fontSize:11}}>{coOrders.length}</span>
              </div>
              {coOrders.length===0
                ? <div style={{padding:'10px 14px',fontSize:13,color:'var(--text3)'}}>لا يوجد طلبات</div>
                : coOrders.map(o=>{
                  const calc=calcOffer(o.items||[],o.discount,o.tax);
                  return (
                    <div key={o.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',
                      padding:'9px 14px',border:'1px solid var(--border)',borderRadius:'var(--r)',
                      marginBottom:6,cursor:'pointer',background:'var(--bg2)'}}
                      onMouseEnter={e=>e.currentTarget.style.background='var(--bg3)'}
                      onMouseLeave={e=>e.currentTarget.style.background='var(--bg2)'}
                      onClick={()=>{setViewingOrder(o);}}>
                      <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                        <span className="cell-code">{o.orderNo}</span>
                        <span style={{fontSize:12,color:'var(--text2)'}}>{o.date}</span>
                        {o.deliveryDate && <span style={{fontSize:11,color:'var(--text3)'}}>📦 {o.deliveryDate}</span>}
                      </div>
                      <div style={{display:'flex',alignItems:'center',gap:8}}>
                        <span className="price-cell">{fmt(calc.afterDisc,o.currency)}</span>
                        <Badge text={o.status} color={statusColor[o.status]||'gray'}/>
                        <span style={{color:'var(--text3)',fontSize:11}}>›</span>
                      </div>
                    </div>
                  );
                })
              }
            </div>
          </Modal>
        );
      })()}

      {/* ── VIEW OFFER MODAL (from customer panel) ── */}
      {viewingOffer && (()=>{
        const co=data.customers.find(c=>c.id===viewingOffer.customerId);
        const calc=calcOffer(viewingOffer.items||[],viewingOffer.discount,viewingOffer.tax);
        return (
          <Modal open={true} title={`📋 ${viewingOffer.offerNo}`} onClose={()=>setViewingOffer(null)} large
            footer={<button className="btn btn-secondary" onClick={()=>setViewingOffer(null)}>{t.close}</button>}>
            <div className="form-grid">
              <div className="form-group"><label className="form-label">{t.offerNo}</label><div className="form-input" style={{background:'var(--bg4)',fontFamily:'Rajdhani',fontWeight:700}}>{viewingOffer.offerNo}</div></div>
              <div className="form-group"><label className="form-label">{t.customer}</label><div className="form-input" style={{background:'var(--bg4)'}}>{co?.name||'—'}</div></div>
              <div className="form-group"><label className="form-label">{t.date}</label><div className="form-input" style={{background:'var(--bg4)'}}>{viewingOffer.date}</div></div>
              <div className="form-group"><label className="form-label">{t.status}</label><div style={{padding:'8px 0'}}><Badge text={viewingOffer.status} color={statusColor[viewingOffer.status]}/></div></div>
            </div>
            <div className="divider"/>
            <div style={{marginBottom:8,fontWeight:700,fontSize:12,color:'var(--text2)',textTransform:'uppercase'}}>{t.lineItems}</div>
            <div className="line-items-wrap">
              <table className="li-table">
                <thead><tr><th>#</th><th>{t.product}</th><th>{t.qty}</th><th>{t.unitPrice}</th><th>{t.lineTotal}</th></tr></thead>
                <tbody>
                  {viewingOffer.items.map((item,i)=>(
                    <tr key={i}><td style={{color:'var(--text3)',width:30}}>{i+1}</td><td>{item.productName}</td><td>{item.qty}</td><td>{fmt(item.unitPrice,viewingOffer.currency)}</td><td style={{fontWeight:600}}>{fmt(item.qty*item.unitPrice,viewingOffer.currency)}</td></tr>
                  ))}
                  <tr className="li-total"><td colSpan="4" style={{textAlign:'right',paddingRight:12,fontWeight:600,color:'var(--text2)'}}>{t.subtotal}</td><td>{fmt(calc.sub,viewingOffer.currency)}</td></tr>
                  {viewingOffer.discount>0&&<tr className="li-total"><td colSpan="4" style={{textAlign:'right',paddingRight:12,color:'var(--red)'}}>Discount ({viewingOffer.discount}%)</td><td>−{fmt(calc.disc,viewingOffer.currency)}</td></tr>}
                  {viewingOffer.tax>0&&<tr className="li-total"><td colSpan="4" style={{textAlign:'right',paddingRight:12}}>VAT ({viewingOffer.tax}%)</td><td>{fmt(calc.taxAmt,viewingOffer.currency)}</td></tr>}
                  <tr className="li-total"><td colSpan="4" style={{textAlign:'right',paddingRight:12,fontSize:15}}>{t.grandTotal}</td><td style={{fontSize:16,color:'var(--primary)'}}>{fmt(calc.grand,viewingOffer.currency)}</td></tr>
                </tbody>
              </table>
            </div>
            {viewingOffer.notes&&<div className="info-box" style={{marginTop:14}}><Icon name="file" size={14}/> {viewingOffer.notes}</div>}
          </Modal>
        );
      })()}

      {/* ── VIEW ORDER MODAL (from customer panel) ── */}
      {viewingOrder && (()=>{
        const co=data.customers.find(c=>c.id===viewingOrder.customerId);
        const calc=calcOffer(viewingOrder.items||[],viewingOrder.discount,viewingOrder.tax);
        return (
          <Modal open={true} title={`🛒 ${viewingOrder.orderNo}`} onClose={()=>setViewingOrder(null)} large
            footer={<button className="btn btn-secondary" onClick={()=>setViewingOrder(null)}>{t.close}</button>}>
            <div className="form-grid">
              <div className="form-group"><label className="form-label">{t.orderNo||'Order No'}</label><div className="form-input" style={{background:'var(--bg4)',fontFamily:'Rajdhani',fontWeight:700}}>{viewingOrder.orderNo}</div></div>
              <div className="form-group"><label className="form-label">{t.customer}</label><div className="form-input" style={{background:'var(--bg4)'}}>{co?.name||'—'}</div></div>
              <div className="form-group"><label className="form-label">{t.date}</label><div className="form-input" style={{background:'var(--bg4)'}}>{viewingOrder.date}</div></div>
              <div className="form-group"><label className="form-label">{t.status}</label><div style={{padding:'8px 0'}}><Badge text={viewingOrder.status} color={statusColor[viewingOrder.status]||'gray'}/></div></div>
              {viewingOrder.deliveryDate&&<div className="form-group"><label className="form-label">{t.deliveryDate}</label><div className="form-input" style={{background:'var(--bg4)'}}>{viewingOrder.deliveryDate}</div></div>}
              {viewingOrder.paymentTerms&&<div className="form-group"><label className="form-label">{t.paymentTerms}</label><div className="form-input" style={{background:'var(--bg4)'}}>{viewingOrder.paymentTerms}</div></div>}
            </div>
            <div className="divider"/>
            <div style={{marginBottom:8,fontWeight:700,fontSize:12,color:'var(--text2)',textTransform:'uppercase'}}>{t.lineItems}</div>
            <div className="line-items-wrap">
              <table className="li-table">
                <thead><tr><th>#</th><th>{t.product}</th><th>{t.qty}</th><th>{t.unitPrice}</th><th>{t.lineTotal}</th></tr></thead>
                <tbody>
                  {viewingOrder.items.map((item,i)=>(
                    <tr key={i}><td style={{color:'var(--text3)',width:30}}>{i+1}</td><td>{item.productName}</td><td>{item.qty}</td><td>{fmt(item.unitPrice,viewingOrder.currency)}</td><td style={{fontWeight:600}}>{fmt(item.qty*item.unitPrice,viewingOrder.currency)}</td></tr>
                  ))}
                  <tr className="li-total"><td colSpan="4" style={{textAlign:'right',paddingRight:12,fontWeight:600,color:'var(--text2)'}}>{t.subtotal}</td><td>{fmt(calc.sub,viewingOrder.currency)}</td></tr>
                  {viewingOrder.discount>0&&<tr className="li-total"><td colSpan="4" style={{textAlign:'right',paddingRight:12,color:'var(--red)'}}>Discount ({viewingOrder.discount}%)</td><td>−{fmt(calc.disc,viewingOrder.currency)}</td></tr>}
                  {viewingOrder.tax>0&&<tr className="li-total"><td colSpan="4" style={{textAlign:'right',paddingRight:12}}>VAT ({viewingOrder.tax}%)</td><td>{fmt(calc.taxAmt,viewingOrder.currency)}</td></tr>}
                  <tr className="li-total"><td colSpan="4" style={{textAlign:'right',paddingRight:12,fontSize:15}}>{t.grandTotal}</td><td style={{fontSize:16,color:'var(--primary)'}}>{fmt(calc.grand,viewingOrder.currency)}</td></tr>
                </tbody>
              </table>
            </div>
            {viewingOrder.notes&&<div className="info-box" style={{marginTop:14}}><Icon name="file" size={14}/> {viewingOrder.notes}</div>}
          </Modal>
        );
      })()}
    </div>
  );
}

// ════════════════════════════════════════════════
//  CONTACTS TAB
// ════════════════════════════════════════════════
function ContactsTab({ data, setData, user, t, showToast, setActiveTab, handleApiError }) {
  const [search, setSearch] = useState('');
  const [filterCompany, setFilterCompany] = useState('');
  const [sortContacts, setSortContacts] = useState('name_asc');
  const [ctPage, setCtPage] = useState(1);
  const [ctPageSize, setCtPageSize] = useState(50);
  const [viewingCustomer, setViewingCustomer] = useState(null);
  const [modal, setModal] = useState(null);
  const [deleteTarget, setDeleteTarget] = useState(null);
  const isAdmin=user.role==='Admin', isManager=user.role==='Manager'||isAdmin;

  const accessibleCos = isManager ? data.customers : data.customers.filter(c=>c.assignedTo===user.id);

  const filtered = data.contacts.filter(c=>{
    const co = data.customers.find(x=>x.id===c.company);
    const accessible = isManager || (co && co.assignedTo===user.id);
    const bySearch = !search || `${c.firstName} ${c.lastName}`.toLowerCase().includes(search.toLowerCase()) || (co&&co.name.toLowerCase().includes(search.toLowerCase()));
    const byCo = !filterCompany || String(c.company)===filterCompany;
    return accessible && bySearch && byCo;
  }).sort((a,b)=>{
    const [col,dir] = sortContacts.split('_');
    let va='', vb='';
    if(col==='name'){ va=`${a.firstName} ${a.lastName}`.toLowerCase(); vb=`${b.firstName} ${b.lastName}`.toLowerCase(); }
    if(col==='company'){ const ca=data.customers.find(x=>x.id===a.company); const cb=data.customers.find(x=>x.id===b.company); va=(ca?.name||'').toLowerCase(); vb=(cb?.name||'').toLowerCase(); }
    if(col==='title'){ va=(a.title||'').toLowerCase(); vb=(b.title||'').toLowerCase(); }
    if(va<vb) return dir==='asc'?-1:1;
    if(va>vb) return dir==='asc'?1:-1;
    return 0;
  });

  const setSortField = (col) => {
    setSortContacts(s => {
      const [curCol, curDir] = s.split('_');
      if(curCol===col) return `${col}_${curDir==='asc'?'desc':'asc'}`;
      return `${col}_asc`;
    });
  };

  const blank = {firstName:'',lastName:'',title:'',company:'',phone:'',email:'',mobile:'',notes:''};
  const [form, setForm] = useState(blank);
  const [formErr, setFormErr] = useState({});
  const [newCoName, setNewCoName] = useState('');
  const [newCoErr, setNewCoErr] = useState('');
  const open=(mode,rec)=>{setForm(rec?{...rec}:{...blank});setFormErr({});setNewCoName('');setNewCoErr('');setModal(mode);};
  const save = async () => {
    const errs={};
    if(!form.firstName) errs.firstName=t.required||'Required';
    if(form.email&&!isValidEmail(form.email)) errs.email='Invalid email format';
    if(form.phone&&!isValidPhone(form.phone)) errs.phone='Invalid phone format';
    if(form.mobile&&!isValidPhone(form.mobile)) errs.mobile='Invalid phone format';
    if(Object.keys(errs).length){setFormErr(errs);return;}
    if(!form.firstName) return;
    try {
      let companyId = Number(form.company)||0;
      if(form.company==='__new__'){
        if(!newCoName.trim()){ setNewCoErr(t.required||'Required'); return; }
        const isDup = data.customers.some(c=>c.name.trim().toLowerCase()===newCoName.trim().toLowerCase());
        if(isDup){ setNewCoErr(t.duplicateCompany||'Company name already exists'); return; }
        const newCo = await apiFetch('POST', '/customers', {
          code:'', name:newCoName.trim(), industry:'Other', phone:'', email:'',
          address:'', website:'', status:'Active', assignedTo:user.id, notes:'', createdAt:today()
        });
        companyId = newCo.id;
        setData(d=>({...d, customers:[...d.customers, newCo]}));
      }
      const rec={...form, company:companyId};
      if(modal==='add'){
        const created = await apiFetch('POST', '/contacts', {...rec, createdAt:today()});
        setData(d=>({...d, contacts:[...d.contacts, created]}));
      } else {
        const updated = await apiFetch('PUT', `/contacts/${rec.id}`, rec);
        setData(d=>({...d, contacts:d.contacts.map(c=>c.id===rec.id?(updated||rec):c)}));
      }
      setModal(null); showToast(t.saved);
    } catch(e) { handleApiError(e); }
  };
  const del = async () => {
    try {
      await apiFetch('DELETE', `/contacts/${deleteTarget}`);
      setData(d=>({...d, contacts:d.contacts.filter(c=>c.id!==deleteTarget)}));
      setDeleteTarget(null); showToast(t.deleted);
    } catch(e) { handleApiError(e); }
  };

  return (
    <div className="tab-content">
      <div className="section-header">
        <div><div className="section-title">{t.contacts}</div><div className="section-subtitle">{filtered.length} {t.totalContacts}</div></div>
        <button className="btn btn-primary" onClick={()=>open('add')}><Icon name="plus" size={15}/> {t.addContact}</button>
      </div>
      <div className="toolbar">
        <div className="search-box">
          <span className="search-icon"><Icon name="search" size={15}/></span>
          <input className="search-input" placeholder={t.search} value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
        <select className="filter-select" value={filterCompany} onChange={e=>setFilterCompany(e.target.value)}>
          <option value="">{t.allCompanies}</option>
          {accessibleCos.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
        <select className="filter-select" value={sortContacts} onChange={e=>setSortContacts(e.target.value)}>
          <option value="name_asc">الاسم A→Z</option>
          <option value="name_desc">الاسم Z→A</option>
          <option value="company_asc">الشركة A→Z</option>
          <option value="title_asc">المسمى A→Z</option>
        </select>
      </div>
      <div className="table-wrap">
        <table className="table">
          <thead><tr>
            <th style={{cursor:'pointer'}} onClick={()=>setSortField('name')}>
              {t.name} <span style={{color:'var(--sky)'}}>{sortContacts.startsWith('name')?sortContacts.endsWith('asc')?'↑':'↓':'↕'}</span>
            </th>
            <th style={{cursor:'pointer'}} onClick={()=>setSortField('title')}>
              {t.title} <span style={{color:'var(--sky)'}}>{sortContacts.startsWith('title')?sortContacts.endsWith('asc')?'↑':'↓':'↕'}</span>
            </th>
            <th style={{cursor:'pointer'}} onClick={()=>setSortField('company')}>
              {t.company} <span style={{color:'var(--sky)'}}>{sortContacts.startsWith('company')?sortContacts.endsWith('asc')?'↑':'↓':'↕'}</span>
            </th>
            <th>{t.phone}</th><th>{t.email2}</th><th>{t.actions}</th>
          </tr></thead>
          <tbody>
            {filtered.length===0?<tr><td colSpan="6"><EmptyState t={t}/></td></tr>:
            filtered.slice((ctPage-1)*ctPageSize, ctPage*ctPageSize).map(c=>{
              const co=data.customers.find(x=>x.id===c.company);
              return (
                <tr key={c.id}>
                  <td><div className="cell-main">{c.firstName} {c.lastName}</div></td>
                  <td style={{color:'var(--text2)',fontSize:13}}>{c.title}</td>
                  <td>{co
                    ? <button className="cell-link" onClick={()=>setViewingCustomer(co)} title={t.goToCompany}>{co.name}</button>
                    : '—'}
                  </td>
                  <td style={{fontSize:13}}>{c.phone}</td>
                  <td style={{fontSize:12}}>{c.email}</td>
                  <td><div className="table-actions">
                    <button className="btn btn-ghost btn-sm btn-icon" onClick={()=>open('edit',c)}><Icon name="edit" size={14}/></button>
                    {isManager&&<button className="btn btn-ghost btn-sm btn-icon" style={{color:'var(--red)'}} onClick={()=>setDeleteTarget(c.id)}><Icon name="trash" size={14}/></button>}
                  </div></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <Pagination total={filtered.length} page={ctPage} pageSize={ctPageSize} onPage={(p)=>setCtPage(p)} onPageSize={(s)=>{setCtPageSize(s);setCtPage(1);}}/>
      <Modal open={!!modal} title={modal==='add'?t.addContact:t.editContact} onClose={()=>setModal(null)}
        footer={<><button className="btn btn-secondary" onClick={()=>setModal(null)}>{t.cancel}</button><button className="btn btn-primary" onClick={save}>{t.save}</button></>}>
        <div className="form-grid">
          <FG label={t.firstName}><input className="form-input" value={form.firstName||''} onChange={e=>setForm({...form,firstName:e.target.value})}/></FG>
          <FG label={t.lastName}><input className="form-input" value={form.lastName||''} onChange={e=>setForm({...form,lastName:e.target.value})}/></FG>
          <FG label={t.title}><input className="form-input" value={form.title||''} onChange={e=>setForm({...form,title:e.target.value})} placeholder="e.g. Procurement Manager"/></FG>
          <FG label={t.company} span={2}>
            <select className="form-select" value={form.company||''} onChange={e=>{setNewCoName('');setNewCoErr('');setForm({...form,company:e.target.value});}}>
              <option value="">— Select Company —</option>
              <option value="__new__">➕ {t.newCompany||'New Company…'}</option>
              {accessibleCos.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
            {form.company==='__new__' && (
              <div style={{marginTop:8,padding:'10px 12px',background:'var(--blue-bg)',border:'1px dashed var(--sky)',borderRadius:'var(--r)'}}>
                <label className="form-label" style={{color:'var(--sky)',marginBottom:5,display:'block'}}>
                  ✦ {t.newCompanyName||'New Company Name'}
                </label>
                <input
                  className="form-input"
                  placeholder={t.companyName||'Company name...'}
                  value={newCoName}
                  onChange={e=>{setNewCoName(e.target.value);setNewCoErr('');}}
                  autoFocus
                  style={{borderColor:newCoErr?'var(--red)':'var(--sky)'}}
                />
                {newCoErr && <div style={{color:'var(--red)',fontSize:11,marginTop:4}}>⚠ {newCoErr}</div>}
                <div style={{fontSize:11,color:'var(--text3)',marginTop:4}}>{t.newCompanyHint||'Will be created automatically when you save the contact.'}</div>
              </div>
            )}
          </FG>
          <FG label={t.phone} error={formErr.phone}><input className={`form-input${formErr.phone?' border-red':''}`} value={form.phone||''} onChange={e=>{setForm({...form,phone:e.target.value});setFormErr(x=>({...x,phone:''}));}} placeholder="+20 ..."/></FG>
          <FG label={t.mobile} error={formErr.mobile}><input className={`form-input${formErr.mobile?' border-red':''}`} value={form.mobile||''} onChange={e=>{setForm({...form,mobile:e.target.value});setFormErr(x=>({...x,mobile:''}));}} /></FG>
          <FG label={t.email2} span={2} error={formErr.email}><input className={`form-input${formErr.email?' border-red':''}`} type="email" value={form.email||''} onChange={e=>{setForm({...form,email:e.target.value});setFormErr(x=>({...x,email:''}));}} /></FG>
          <FG label={t.notes} span={2}><textarea className="form-textarea" value={form.notes||''} onChange={e=>setForm({...form,notes:e.target.value})}/></FG>
        </div>
      </Modal>
      <Confirm open={!!deleteTarget} t={t} title={t.deleteConfirm} message={t.deleteMsg} onConfirm={del} onCancel={()=>setDeleteTarget(null)}/>

      {/* ── CUSTOMER QUICK VIEW MODAL ── */}
      {viewingCustomer && (()=>{
        const rep = data.users.find(u=>u.id===viewingCustomer.assignedTo);
        const coOffers = data.offers.filter(o=>o.customerId===viewingCustomer.id);
        const coOrders = data.orders.filter(o=>o.customerId===viewingCustomer.id);
        return (
          <Modal open={true} title={viewingCustomer.name} onClose={()=>setViewingCustomer(null)}>
            <div className="company-panel-header">
              <div className="company-panel-icon"><Icon name="building" size={22}/></div>
              <div>
                <div className="company-panel-name">{viewingCustomer.name}</div>
                <div className="company-panel-meta">
                  {viewingCustomer.code} &nbsp;·&nbsp; {viewingCustomer.industry} &nbsp;·&nbsp;
                  <Badge text={viewingCustomer.status} color={statusColor[viewingCustomer.status]||'gray'}/>
                  {rep && <span style={{marginLeft:8,color:'rgba(255,255,255,.8)'}}>👤 {rep.name}</span>}
                </div>
              </div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:14}}>
              {[
                {label:'Phone',val:viewingCustomer.phone},
                {label:'Email',val:viewingCustomer.email},
                {label:'Address',val:viewingCustomer.address},
              ].map(({label,val})=>(
                <div key={label} style={{background:'var(--bg3)',borderRadius:8,padding:'10px 12px'}}>
                  <div style={{fontSize:10,fontWeight:700,color:'var(--text3)',textTransform:'uppercase',letterSpacing:.5,marginBottom:3}}>{label}</div>
                  <div style={{fontSize:12,color:'var(--text)'}}>{val||'—'}</div>
                </div>
              ))}
            </div>
            <div style={{display:'flex',gap:12,fontSize:12,color:'var(--text2)'}}>
              <span>📋 {coOffers.length} {t.totalOffers}</span>
              <span>🛒 {coOrders.length} {t.totalOrders}</span>
            </div>
            {viewingCustomer.notes && <div className="info-box" style={{marginTop:12}}><Icon name="file" size={13}/> {viewingCustomer.notes}</div>}
          </Modal>
        );
      })()}
    </div>
  );
}

// ════════════════════════════════════════════════
//  OFFERS TAB
// ════════════════════════════════════════════════
function OffersTab({ data, setData, user, t, showToast, setActiveTab, handleApiError }) {
  const [search, setSearch] = useState('');
  const [filterStatus, setFilterStatus] = useState('');
  const [filterCustomer, setFilterCustomer] = useState('');
  const [sortOffers, setSortOffers] = useState('date_desc');
  const [modal, setModal] = useState(null); // 'add'|'edit'|'view'
  const [deleteTarget, setDeleteTarget] = useState(null);
  const [offPage, setOffPage] = useState(1);
  const [offPageSize, setOffPageSize] = useState(50);
  const [viewingCustomerOff, setViewingCustomerOff] = useState(null);
  const isAdmin=user.role==='Admin', isManager=user.role==='Manager'||isAdmin;

  const statuses=['Draft','Sent','Accepted','Rejected','Expired'];
  const accCos = isManager ? data.customers : data.customers.filter(c=>c.assignedTo===user.id);

  const filtered = data.offers.filter(o=>{
    const byRole = isManager || o.createdBy===user.id;
    const co=data.customers.find(c=>c.id===o.customerId);
    const bySearch=!search||o.offerNo.includes(search)||(co&&co.name.toLowerCase().includes(search.toLowerCase()));
    const bySt=!filterStatus||o.status===filterStatus;
    const byCo=!filterCustomer||String(o.customerId)===filterCustomer;
    return byRole&&bySearch&&bySt&&byCo;
  }).sort((a,b)=>{
    const [col,dir]=sortOffers.split('_');
    let va='', vb='';
    if(col==='date'){va=new Date(a.date);vb=new Date(b.date);}
    if(col==='offerNo'){va=a.offerNo||'';vb=b.offerNo||'';}
    if(col==='status'){va=a.status||'';vb=b.status||'';}
    if(col==='total'){
      const ca=calcOffer(a.items||[],a.discount,a.tax);
      const cb=calcOffer(b.items||[],b.discount,b.tax);
      va=ca.afterDisc; vb=cb.afterDisc;
    }
    if(va<vb) return dir==='asc'?-1:1;
    if(va>vb) return dir==='asc'?1:-1;
    return 0;
  });

  const blankForm = { offerNo:'', date:today(), customerId:'', currency:'EGP', discount:0, tax:14, notes:'', status:'Draft', items:[] };
  const [form, setForm] = useState(blankForm);

  const [newOfferCoName, setNewOfferCoName] = useState('');
  const [newOfferCoErr, setNewOfferCoErr] = useState('');
  const [coSearch, setCoSearch] = useState('');
  const [prodSearches, setProdSearches] = useState({});
  const open=(mode,rec)=>{
    if(mode==='add'){
      const newNo=`OFR-${new Date().getFullYear()}-${String(nextId(data.offers)).padStart(3,'0')}`;
      setForm({...blankForm, offerNo:newNo, createdBy:user.id});
    } else {
      setForm({...rec, items:[...rec.items.map(i=>({...i}))]});
    }
    setNewOfferCoName(''); setNewOfferCoErr('');
    setCoSearch(''); setProdSearches({});
    setModal(mode);
  };

  const addItem=()=>setForm(f=>({...f, items:[...f.items, {productId:'',productName:'',qty:1,unitPrice:0}]}));
  const removeItem=(i)=>setForm(f=>({...f, items:f.items.filter((_,j)=>j!==i)}));
  const updateItem=(i,field,val)=>setForm(f=>{
    const items=[...f.items]; items[i]={...items[i],[field]:val};
    if(field==='productId'){
      const p=data.products.find(x=>x.id===Number(val));
      if(p){items[i].productName=p.name; items[i].unitPrice=f.currency==='USD'?p.priceUSD:p.priceEGP;}
    }
    return {...f,items};
  });

  const { sub, disc, afterDisc, taxAmt, grand } = calcOffer(form.items||[], form.discount, form.tax);

  const save = async () => {
    let customerId = form.customerId;
    try {
      if(customerId==='__new__'){
        if(!newOfferCoName.trim()){ setNewOfferCoErr(t.required||'Required'); return; }
        const isDup=data.customers.some(c=>c.name.trim().toLowerCase()===newOfferCoName.trim().toLowerCase());
        if(isDup){ setNewOfferCoErr(t.duplicateCompany||'Company name already exists'); return; }
        const newCo = await apiFetch('POST', '/customers', {
          code:'', name:newOfferCoName.trim(), industry:'Other', phone:'', email:'',
          address:'', website:'', status:'Active', assignedTo:user.id, notes:'', createdAt:today()
        });
        setData(d=>({...d, customers:[...d.customers, newCo]}));
        customerId = newCo.id;
      }
      if(!customerId||!form.items.length) return;
      const payload = {...form, customerId:Number(customerId)};
      if(modal==='add'){
        const created = await apiFetch('POST', '/offers', payload);
        setData(d=>({...d, offers:[...d.offers, created]}));
      } else {
        const updated = await apiFetch('PUT', `/offers/${form.id}`, payload);
        setData(d=>({...d, offers:d.offers.map(o=>o.id===form.id?(updated||payload):o)}));
      }
      setModal(null); setNewOfferCoName(''); showToast(t.saved);
    } catch(e) { handleApiError(e); }
  };

  const convertToOrder = async (offer) => {
    if(data.orders.find(o=>o.offerId===offer.id)){
      showToast(t.alreadyConverted,'error');
      setModal(null); return;
    }
    try {
      const newOrd = {
        orderNo:`ORD-${new Date().getFullYear()}-${String(nextId(data.orders)).padStart(3,'0')}`,
        date:today(), customerId:offer.customerId, offerId:offer.id,
        status:'Pending', currency:offer.currency, discount:offer.discount, tax:offer.tax,
        notes:'', deliveryDate:'', paymentTerms:'Net 30', shippingAddress:'',
        createdBy:user.id, items:[...offer.items.map(i=>({...i}))],
      };
      const [updatedOffer, createdOrder] = await Promise.all([
        apiFetch('PUT', `/offers/${offer.id}`, {...offer, status:'Accepted'}),
        apiFetch('POST', '/orders', newOrd),
      ]);
      setData(d=>({
        ...d,
        offers:d.offers.map(o=>o.id===offer.id?(updatedOffer||{...offer,status:'Accepted'}):o),
        orders:[...d.orders, createdOrder],
      }));
      setModal(null); showToast(t.converted);
      setTimeout(()=>setActiveTab('orders'), 400);
    } catch(e) { handleApiError(e); }
  };

  const del = async () => {
    try {
      await apiFetch('DELETE', `/offers/${deleteTarget}`);
      setData(d=>({...d, offers:d.offers.filter(o=>o.id!==deleteTarget)}));
      setDeleteTarget(null); showToast(t.deleted);
    } catch(e) { handleApiError(e); }
  };

  return (
    <div className="tab-content">
      <div className="section-header">
        <div><div className="section-title">{t.offers}</div><div className="section-subtitle">{filtered.length} {t.totalOffers}</div></div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-excel btn-sm" onClick={()=>{
            const rows=filtered.map(o=>{const co=data.customers.find(c=>c.id===o.customerId);const calc=calcOffer(o.items||[],o.discount,o.tax);return{OfferNo:o.offerNo,Date:o.date,Customer:co?.name||'',Items:o.items?.length||0,Currency:o.currency,Subtotal:calc.sub,Discount:calc.disc,Tax:calc.taxAmt,Total:calc.grand,Status:o.status,Notes:o.notes||''};});
            exportToExcel(rows,'Offers','offers.xlsx').catch(()=>showToast('Export failed','error'));
          }}><Icon name="xls" size={14}/> Export</button>
          <button className="btn btn-primary" onClick={()=>open('add')}><Icon name="plus" size={15}/> {t.addOffer}</button>
        </div>
      </div>
      <div className="toolbar">
        <div className="search-box">
          <span className="search-icon"><Icon name="search" size={15}/></span>
          <input className="search-input" placeholder={t.search} value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
        <select className="filter-select" value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
          <option value="">{t.filterStatus}</option>
          {statuses.map(s=>{const k=s.toLowerCase().replace(/ /g,'');return <option key={s} value={s}>{t[k]||s}</option>;})}
        </select>
        <select className="filter-select" value={filterCustomer} onChange={e=>setFilterCustomer(e.target.value)}>
          <option value="">كل العملاء</option>
          {accCos.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
        <select className="filter-select" value={sortOffers} onChange={e=>setSortOffers(e.target.value)}>
          <option value="date_desc">الأحدث أولاً</option>
          <option value="date_asc">الأقدم أولاً</option>
          <option value="total_desc">الأعلى قيمة</option>
          <option value="total_asc">الأقل قيمة</option>
          <option value="status_asc">الحالة A→Z</option>
          <option value="offerNo_asc">الرقم A→Z</option>
        </select>
      </div>
      <div className="table-wrap">
        <table className="table">
          <thead><tr><th>{t.offerNo}</th><th>{t.date}</th><th>{t.customer}</th><th>{t.items}</th><th>{t.grandTotal}</th><th>{t.status}</th><th>{t.actions}</th></tr></thead>
