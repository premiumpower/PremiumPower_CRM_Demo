              </div>
              <span style={{fontFamily:'Rajdhani',fontWeight:700,fontSize:24,color:netReceivable<0?'var(--red)':'var(--green)'}}>
                {netReceivable<0?'−':''}{fmtC(netReceivable)}
              </span>
            </div>

            {/* Tax summary boxes */}
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginTop:16}}>
              <div style={{padding:'12px',background:'var(--blue-bg)',borderRadius:'var(--r)',border:'1px solid rgba(0,156,222,.2)'}}>
                <div style={{fontSize:10,fontWeight:700,color:'var(--sky)',textTransform:'uppercase',letterSpacing:'.4px'}}>VAT Collected</div>
                <div style={{fontFamily:'Rajdhani',fontWeight:700,fontSize:16,color:'var(--sky)',marginTop:4}}>{fmtC(vatAmt)}</div>
                <div style={{fontSize:10,color:'var(--text3)',marginTop:2}}>تُسدَّد للضرائب</div>
              </div>
              <div style={{padding:'12px',background:'var(--red-bg)',borderRadius:'var(--r)',border:'1px solid rgba(209,52,56,.15)'}}>
                <div style={{fontSize:10,fontWeight:700,color:'var(--red)',textTransform:'uppercase',letterSpacing:'.4px'}}>{t.totalTaxBurden||'Total Deducted'}</div>
                <div style={{fontFamily:'Rajdhani',fontWeight:700,fontSize:16,color:'var(--red)',marginTop:4}}>−{fmtC(totalTax)}</div>
                <div style={{fontSize:10,color:'var(--text3)',marginTop:2}}>
                  {base>0?`${((totalTax/base)*100).toFixed(1)}% من المبلغ`:'—'}
                </div>
              </div>
            </div>

            {/* Visual breakdown bar */}
            {base>0&&(()=>{
              const total = netReceivable+totalTaxBurden;
              const safeTotal = total > 0 ? total : 1;
              return (
                <div style={{marginTop:16}}>
                  <div style={{fontSize:10,color:'var(--text3)',marginBottom:6,fontWeight:700,textTransform:'uppercase',letterSpacing:'.4px'}}>Breakdown</div>
                  <div style={{display:'flex',height:10,borderRadius:5,overflow:'hidden',gap:2}}>
                    <div style={{flex:Math.max(0,netReceivable),background:'var(--green)',borderRadius:5}} title={`Net: ${fmtC(netReceivable)}`}/>
                    {vatAmt>0&&<div style={{flex:vatAmt,background:'var(--sky)',borderRadius:5}} title={`VAT: ${fmtC(vatAmt)}`}/>}
                    {withholdingAmt>0&&<div style={{flex:withholdingAmt,background:'var(--yellow)',borderRadius:5}} title={`W/H: ${fmtC(withholdingAmt)}`}/>}
                    {incomeAmt>0&&<div style={{flex:incomeAmt,background:'var(--red)',borderRadius:5}} title={`Income: ${fmtC(incomeAmt)}`}/>}
                  </div>
                  <div style={{display:'flex',gap:14,marginTop:8,flexWrap:'wrap'}}>
                    {[
                      ['var(--green)',  `Net Receivable (${((Math.max(0,netReceivable)/safeTotal)*100).toFixed(0)}%)`],
                      vatAmt>0        ?['var(--sky)',    `VAT ${rates.vat}%`]            :null,
                      withholdingAmt>0?['var(--yellow)', `W/H ${rates.withholding}%`]   :null,
                      incomeAmt>0     ?['var(--red)',    `Income ${rates.income}%`]      :null,
                    ].filter(Boolean).map(([color,label],i)=>(
                      <div key={i} style={{display:'flex',alignItems:'center',gap:5,fontSize:11,color:'var(--text2)'}}>
                        <div style={{width:10,height:10,borderRadius:2,background:color,flexShrink:0}}/>
                        {label}
                      </div>
                    ))}
                  </div>
                </div>
              );
            })()}
          </div>
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════
//  USERS TAB  (Admin only)
// ════════════════════════════════════════════════
function UsersTab({ data, setData, user, t, showToast, handleApiError }) {
  const [modal, setModal] = useState(null);
  const [deleteTarget, setDeleteTarget] = useState(null);
  const blank={name:'',email:'',role:'Sales Rep',password:'',active:true};
  const [form,setForm]=useState(blank);
  const roles=['Admin','Manager','Sales Rep'];
  const open=(mode,rec)=>{setForm(rec?{...rec,password:''}:{...blank});setModal(mode);};
  const save = async () => {
    if(!form.name||!form.email) return;
    try {
      if(modal==='add'){
        const payload = {...form, password: form.password||'changeme'};
        const created = await apiFetch('POST', '/users', payload);
        setData(d=>({...d, users:[...d.users, created]}));
      } else {
        // Only send password if user typed a new one
        const payload = form.password ? form : (({password,...rest})=>rest)(form);
        const updated = await apiFetch('PUT', `/users/${form.id}`, payload);
        setData(d=>({...d, users:d.users.map(u=>u.id===form.id?(updated||{...form,password:u.password}):u)}));
      }
      setModal(null); showToast(t.saved);
    } catch(e) { handleApiError(e); }
  };
  const del = async () => {
    if(deleteTarget===user.id) return;
    try {
      await apiFetch('DELETE', `/users/${deleteTarget}`);
      setData(d=>({...d, users:d.users.filter(u=>u.id!==deleteTarget)}));
      setDeleteTarget(null); showToast(t.deleted);
    } catch(e) { handleApiError(e); }
  };

  return (
    <div className="tab-content">
      <div className="section-header">
        <div><div className="section-title">{t.users}</div><div className="section-subtitle">{data.users.length} {t.usersCount}</div></div>
        <button className="btn btn-primary" onClick={()=>open('add')}><Icon name="plus" size={15}/> {t.addUser}</button>
      </div>
      <div className="table-wrap">
        <table className="table">
          <thead><tr><th>{t.name}</th><th>{t.email2}</th><th>{t.role}</th><th>{t.status}</th><th>{t.actions}</th></tr></thead>
          <tbody>
            {data.users.map(u=>(
              <tr key={u.id}>
                <td><div style={{display:'flex',alignItems:'center',gap:10}}><div className="user-avatar" style={{width:32,height:32,fontSize:11}}>{initials(u.name)}</div><span className="cell-main">{u.name}{u.id===user.id&&<span style={{fontSize:10,color:'var(--primary)',marginLeft:6,fontWeight:700}}>YOU</span>}</span></div></td>
                <td style={{fontSize:13}}>{u.email}</td>
                <td><span className={`badge ${roleBadge[u.role]||'badge-gray'}`}>{t[u.role==='Sales Rep'?'salesRep':u.role.toLowerCase()]||u.role}</span></td>
                <td><Badge text={u.active?t.active2:t.inactive} color={u.active?'green':'gray'}/></td>
                <td><div className="table-actions">
                  <button className="btn btn-ghost btn-sm btn-icon" onClick={()=>open('edit',u)}><Icon name="edit" size={14}/></button>
                  {u.id!==user.id&&<button className="btn btn-ghost btn-sm btn-icon" style={{color:'var(--red)'}} onClick={()=>setDeleteTarget(u.id)}><Icon name="trash" size={14}/></button>}
                </div></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <Modal open={!!modal} title={modal==='add'?t.addUser:t.editUser} onClose={()=>setModal(null)}
        footer={<><button className="btn btn-secondary" onClick={()=>setModal(null)}>{t.cancel}</button><button className="btn btn-primary" onClick={save}>{t.save}</button></>}>
        <div className="form-grid">
          <FG label={t.name} span={2}><input className="form-input" value={form.name||''} onChange={e=>setForm({...form,name:e.target.value})}/></FG>
          <FG label={t.email2} span={2}><input className="form-input" type="email" value={form.email||''} onChange={e=>setForm({...form,email:e.target.value})}/></FG>
          <FG label={t.role}>
            <select className="form-select" value={form.role||'Sales Rep'} onChange={e=>setForm({...form,role:e.target.value})}>
              {roles.map(r=><option key={r}>{r}</option>)}
            </select>
          </FG>
          <FG label={t.status}>
            <select className="form-select" value={form.active?'Active':'Inactive'} onChange={e=>setForm({...form,active:e.target.value==='Active'})}>
              <option>Active</option><option>Inactive</option>
            </select>
          </FG>
          <FG label={modal==='add'?t.password2:t.leaveBlankPass} span={2}>
            <input className="form-input" type="password" value={form.password||''} onChange={e=>setForm({...form,password:e.target.value})} placeholder={modal==='edit'?t.leaveBlankPass:'•••••••'}/>
          </FG>
        </div>
      </Modal>
      <Confirm open={!!deleteTarget} t={t} title={t.deleteConfirm} message={t.deleteMsg} onConfirm={del} onCancel={()=>setDeleteTarget(null)}/>
    </div>
  );
}

function App() {
  const [lang, setLang] = useState(() => {
    try { return localStorage.getItem('pp_crm_lang') || 'en'; } catch(e) { return 'en'; }
  });
  const [currentUser, setCurrentUser] = useState(null);
  const [activeTab, setActiveTab] = useState('dashboard');
  const [data, setData] = useState(EMPTY_DATA);
  const [loading, setLoading] = useState(true);
  const [toast, setToast] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [showResetConfirm, setShowResetConfirm] = useState(false);
  const importRef = React.useRef();

  const t = T[lang];

  // Persist language preference
  useEffect(()=>{
    try { localStorage.setItem('pp_crm_lang', lang); } catch(e) {}
    const el=document.getElementById('html-root');
    el.setAttribute('lang',lang);
    el.setAttribute('dir',lang==='ar'?'rtl':'ltr');
  },[lang]);

  // ── DEMO: Load data from local DEMO_DATA ──────
  const loadAllData = async () => {
    setLoading(true);
    await new Promise(r=>setTimeout(r,600)); // simulate loading
    _demoData = JSON.parse(JSON.stringify(DEMO_DATA)); // reset to original
    setData({
      customers: [..._demoData.customers],
      contacts:  [..._demoData.contacts],
      products:  [..._demoData.products],
      offers:    [..._demoData.offers],
      orders:    [..._demoData.orders],
      users:     [..._demoData.users],
      taxSettings: {..._demoData.taxSettings},
      costSheets:  [..._demoData.costSheets],
    });
    setLoading(false);
  };

  // ── DEMO: Auto-login on first load ────────────
  useEffect(()=>{
    setCurrentUser(DEMO_DATA.users[0]);
    loadAllData();
  }, []); // eslint-disable-line

  const showToast = (msg, type='success') => {
    setToast({msg,type});
    setTimeout(()=>setToast(null), 3200);
  };

  const handleLogin = (user) => {
    setCurrentUser(user);
    loadAllData();
  };

  const handleLogout = () => {
    // Demo: reset data instead of logout
    setCurrentUser(DEMO_DATA.users[0]);
    loadAllData();
    showToast('Demo data reset ✅');
  };

  // ── Handle global 401 (session expired mid-use) ─
  const handleApiError = (e) => {
    if (e.status === 401) { handleLogout(); showToast('Session expired — please log in','error'); }
    else showToast(e.message||'Error','error');
  };

  // ── Export backup ──────────────────────────────
  const exportBackup = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `premiumpower_backup_${today()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast(lang==='ar' ? 'تم تصدير النسخة الاحتياطية' : 'Backup exported');
  };

  // ── Import backup (local preview only — doesn't write to DB) ──
  const importBackup = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (!parsed.users || !parsed.customers) throw new Error('Invalid file');
        setData({ ...EMPTY_DATA, ...parsed });
        showToast(lang==='ar' ? 'تم تحميل النسخة الاحتياطية محلياً (للعرض فقط)' : 'Backup loaded locally (view-only — not saved to DB)');
      } catch(err) {
        showToast(lang==='ar' ? 'ملف غير صالح' : 'Invalid backup file', 'error');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  // ── Reload from DB ─────────────────────────────
  const reloadFromDB = () => {
    loadAllData();
    setShowResetConfirm(false);
    showToast(lang==='ar' ? 'تم إعادة التحميل من قاعدة البيانات' : 'Reloaded from database');
  };

  const counts = {
    customers: data.customers.filter(c=>c.status==='Active').length,
    contacts: data.contacts.length,
    offers: data.offers.filter(o=>o.status==='Draft'||o.status==='Sent').length,
    orders: data.orders.filter(o=>o.status==='Pending'||o.status==='Processing').length,
  };

  // ── Loading screen ─────────────────────────────
  if (loading) {
    return (
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',flexDirection:'column',gap:16,background:'var(--primary)'}}>
        <div style={{width:48,height:48,background:'linear-gradient(135deg,#009CDE,#0070BA)',borderRadius:12,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Rajdhani',fontWeight:700,fontSize:20,color:'var(--primary)'}}>PP</div>
        <div style={{color:'rgba(255,255,255,.7)',fontSize:13,letterSpacing:1}}>{lang==='ar'?'جارٍ التحميل…':'Loading…'}</div>
        <div style={{width:200,height:3,background:'rgba(255,255,255,.15)',borderRadius:2,overflow:'hidden'}}>
          <div style={{height:'100%',width:'60%',background:'var(--gold)',borderRadius:2,animation:'loadBar 1.2s ease infinite'}}/>
        </div>
        <style>{`@keyframes loadBar{0%{transform:translateX(-200%)}100%{transform:translateX(300%)}}`}</style>
      </div>
    );
  }

  if(!currentUser) {
    return <LoginScreen onLogin={handleLogin} t={t} lang={lang} setLang={setLang}/>;
  }

  const tabs = { dashboard: DashboardTab, customers: CustomersTab, contacts: ContactsTab, offers: OffersTab, orders: OrdersTab, pricelist: PricelistTab, costsheet: CostSheetTab, taxcalc: TaxCalcTab, users: UsersTab };
  const TabComp = tabs[activeTab] || DashboardTab;

  return (
    <div>
    <div className="demo-banner">
      <span>⚡ PremiumPower CRM — <strong>Interactive Demo</strong> · All changes are temporary and reset on refresh</span>
      <span className="demo-badge">DEMO</span>
    </div>
    <div className="app-layout">
      {sidebarOpen && <div className="mobile-overlay" onClick={()=>setSidebarOpen(false)}/>}
      <Sidebar activeTab={activeTab} setActiveTab={(t)=>{setActiveTab(t);setSidebarOpen(false);}} user={currentUser} onLogout={()=>{ loadAllData(); showToast('Demo data reset ✅'); }} t={t} counts={counts} open={sidebarOpen}/>
      <div className="main-content">
        <div className="topbar">
          <button className="hamburger" onClick={()=>setSidebarOpen(s=>!s)}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div className="topbar-title"><span>Premium</span>Power <span style={{fontWeight:400,fontSize:14,color:'var(--text2)',marginLeft:6}}>CRM</span></div>

          {/* ── Data tools ── */}
          <div className="topbar-data-tools">
            <button className="topbar-tool-btn" title="Reset demo data" onClick={()=>{ loadAllData(); showToast('Demo data reset ✅'); }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-5"/></svg>
              <span>{lang==='ar'?'تحديث':'Refresh'}</span>
            </button>
            <button className="topbar-tool-btn" style={{opacity:.4,cursor:'not-allowed'}} title="Disabled in demo">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              <span>{lang==='ar'?'تصدير':'Export'}</span>
            </button>
            <button className="topbar-tool-btn" style={{display:'none'}}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span>{lang==='ar'?'استيراد':'Import'}</span>
            </button>
            <input ref={importRef} type="file" accept=".json" style={{display:'none'}} onChange={importBackup}/>
          </div>

          <div className="lang-toggle">
            <button className={`lang-btn${lang==='en'?' active':''}`} onClick={()=>setLang('en')}>EN</button>
            <button className={`lang-btn${lang==='ar'?' active':''}`} onClick={()=>setLang('ar')}>AR</button>
          </div>
        </div>
        <TabComp data={data} setData={setData} user={currentUser} t={t} showToast={showToast} setActiveTab={setActiveTab} handleApiError={handleApiError} reloadData={loadAllData}/>
      </div>
      {toast && <Toast msg={toast.msg} type={toast.type}/>}
    </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
